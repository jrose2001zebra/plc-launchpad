<title>PLC Launchpad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>/* PLC Launchpad 2.0
   Layout: a launchpad homepage with four doors (Plans, Meetings, Assessments & Results, Team settings).
   Each door opens a plain page; plan work happens one question per screen. Lots of white space,
   one soft color per door, friendly rounded type. */
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#1F2733; --soft:#6B7380; --line:#E3E6EB; --wash:#F1F3F6;
  --plans:#3E7BFA; --meet:#E08A3C; --assess:#8A63C6; --set:#6B7380; --good:#2BA37E; --warn:#D9822B; --alert:#C2334D;
  /* names used by shared components */
  --learn:var(--plans); --check:var(--assess); --reteach:var(--good); --stretch:var(--plans); --team:var(--meet);
  --on:#FFFFFF;
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161B; --card:#1C2027; --ink:#E9ECF1; --soft:#9AA3B0; --line:#2C323C; --wash:#22272F;
  --plans:#7FA6FF; --meet:#F0AA6A; --assess:#B79AEA; --set:#9AA3B0; --good:#5CCAA5; --warn:#F0AA6A; --alert:#FF7C93;
  --on:#13161B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161B; --card:#1C2027; --ink:#E9ECF1; --soft:#9AA3B0; --line:#2C323C; --wash:#22272F;
  --plans:#7FA6FF; --meet:#F0AA6A; --assess:#B79AEA; --set:#9AA3B0; --good:#5CCAA5; --warn:#F0AA6A; --alert:#FF7C93;
  --on:#13161B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.1rem;font-weight:800}
h4{font-size:1rem;font-weight:800}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plans);outline-offset:3px;border-radius:10px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .fill{fill:currentColor;stroke:none}
.muted{color:var(--soft)} .small{font-size:.9rem} .num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* areas: each door and its pages share one color */
.a-plans,.f-learn,.f-stretch{--k:var(--plans)} .a-meet,.f-team{--k:var(--meet)} .a-assess,.f-check{--k:var(--assess)}
.a-set,.f-tool{--k:var(--set)} .f-reteach{--k:var(--good)}
.f-learn,.f-stretch,.f-team,.f-check,.f-tool,.f-reteach,.a-plans,.a-meet,.a-assess,.a-set{--c:var(--k)}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:1.08rem;white-space:nowrap}
.team-name{border:0;background:none;color:var(--soft);font-weight:700;font-size:.95rem;padding:4px 8px;border-radius:10px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-name:hover{background:var(--wash);color:var(--ink)}
.top .spacer{flex:1}
.status-dot{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--soft);white-space:nowrap}
.status-dot i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.status-dot.saving i{background:var(--warn)} .status-dot.error i{background:var(--alert)}
.timer-pill{display:flex;align-items:center;gap:8px;background:var(--meet);color:var(--on);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem;text-decoration:none}
.timer-pill b{font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding-block:10px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--soft);margin-bottom:14px}
.crumbs a{text-decoration:none;font-weight:700;color:var(--soft)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs .ico{width:14px;height:14px}
.page-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.page-head .lead{display:grid;gap:6px;max-width:60ch}
.page-head p{color:var(--soft)}
.demo-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-size:.88rem;color:var(--soft);margin-bottom:18px}
.demo-banner .btn{margin-left:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:800;text-decoration:none;font-size:.97rem;line-height:1.2;background:var(--k,var(--plans));color:var(--on);white-space:nowrap}
.btn .ico{width:18px;height:18px}
.btn.big{padding:14px 26px;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--soft)}
.btn.soft{background:var(--wash);color:var(--ink)}
.btn.fam{background:color-mix(in srgb,var(--k) 14%,var(--card));color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--alert);border:1.5px solid color-mix(in srgb,var(--alert) 35%,var(--line))}
.btn:disabled{opacity:.45;cursor:default}
.btn.lead-orb .orb{display:none}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:var(--soft)}
.icon-btn:hover{background:var(--wash);color:var(--ink)}
.linkish{border:0;background:none;padding:0;color:var(--k,var(--plans));font-weight:800;cursor:pointer;text-decoration:none}
.linkish:hover{text-decoration:underline}
.link-quiet{color:var(--soft);font-weight:700;font-size:.95rem;text-decoration:none}
.link-quiet:hover{color:var(--ink);text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* ---------- cards & lists ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:grid;gap:14px;align-content:start;min-width:0}
.card.tint{background:var(--card)}
.card-head{display:flex;gap:12px;align-items:center}
.card-head .grow{flex:1;min-width:0;display:grid;gap:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--soft);display:grid;gap:10px;justify-items:center}
.orb{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k,var(--set)) 15%,var(--card));color:var(--k,var(--set))}
.orb.sm{width:32px;height:32px}.orb.sm .ico{width:16px;height:16px}
.orb.lg{width:52px;height:52px}.orb.lg .ico{width:24px;height:24px}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--wash);border-radius:14px;padding:10px 14px;text-decoration:none;border:0;text-align:left;width:100%}
a.li:hover{background:color-mix(in srgb,var(--k,var(--plans)) 9%,var(--wash))}
.li b{display:block;font-weight:700;overflow-wrap:anywhere}
.li .sub{display:block;font-size:.85rem;color:var(--soft)}
.li.todo.done b{text-decoration:line-through;opacity:.6}
.check-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:transparent;color:#fff;padding:0}
.check-circle[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check-circle .ico{width:14px;height:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--wash);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:.78rem;flex:none}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;color:var(--soft)}
.privacy .ico{width:16px;height:16px;margin-top:3px}

/* ---------- home: the launchpad ---------- */
.hello{display:grid;gap:4px;margin:8px 0 26px}
.hello h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.hello p{color:var(--soft);font-size:1.1rem}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.door{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;border-top:5px solid var(--k)}
.door-head{display:flex;gap:12px;align-items:center}
.door-head h2{font-size:1.2rem}
.door .acts{display:grid;gap:8px}
.act{display:block;border-radius:14px;padding:10px 12px;background:var(--wash);font-weight:800;font-size:.95rem;text-decoration:none;border:0;text-align:left;width:100%}
.act:hover{background:color-mix(in srgb,var(--k) 12%,var(--wash))}
.act small{display:block;font-weight:600;color:var(--soft);font-size:.84rem}
.act.main{background:var(--k);color:var(--on)}
.act.main small{color:color-mix(in srgb,var(--on) 85%,transparent)}
.act.main:hover{background:color-mix(in srgb,var(--k) 88%,var(--ink))}
.home-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ---------- plan checklist ---------- */
.plan-q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 8px}
.plan-q h3{display:flex;gap:12px;align-items:center;padding:12px 12px 6px}
.plan-q h3 .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--plans) 14%,var(--card));color:var(--plans);font-size:.95rem;flex:none}
.plan-q h3 .n.done{background:var(--good);color:#fff}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;text-decoration:none}
.task:hover{background:var(--wash)}
.task .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task .tick.half{border-color:var(--plans);background:linear-gradient(90deg,var(--plans) 50%,transparent 50%)}
.task .tick.on{background:var(--good);border-color:var(--good);color:#fff}
.task .tick .ico{width:13px;height:13px}
.task b{font-weight:700}
.task .next{font-size:.8rem;font-weight:800;color:var(--plans);background:color-mix(in srgb,var(--plans) 12%,var(--card));padding:2px 10px;border-radius:999px}
.task .go{color:var(--soft)}
.plan-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.plan-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:10px;text-decoration:none}
.plan-card:hover{border-color:var(--plans)}
.plan-card b{font-size:1.08rem}
.bar{height:8px;border-radius:999px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:var(--k,var(--plans));border-radius:999px}

/* ---------- one question per screen ---------- */
.focus{max-width:760px;margin:0 auto;display:grid;gap:18px}
.q-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--soft);font-size:.92rem;font-weight:700}
.q-dots{display:flex;gap:6px}
.q-dots a{width:9px;height:9px;border-radius:50%;background:var(--line)}
.q-dots a.on{background:var(--good)} .q-dots a.cur{background:var(--k);width:24px;border-radius:999px}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,40px);display:grid;gap:22px}
.q-card .ask{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800;line-height:1.2}
.q-card .hint{color:var(--soft);font-size:1.03rem;margin-top:-12px}
.q-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.done-note{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:.88rem;color:var(--soft)}
.done-note .ico{width:15px;height:15px;color:var(--good)}
.st-body{display:grid;gap:20px}

/* "What does this mean?" and tips, folded away */
.term{display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:0;color:var(--soft);font-weight:700;font-size:.9rem;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;cursor:pointer}
.term .tag{display:none}
.term[aria-expanded="true"]{color:var(--ink)}
.def{background:var(--wash);border-radius:14px;padding:12px 16px;display:grid;gap:8px;max-width:60ch;font-size:.95rem}
details.zava{background:var(--wash);border-radius:14px;padding:10px 14px}
details.zava>summary{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:700;list-style:none;font-size:.92rem;color:var(--soft)}
details.zava>summary::-webkit-details-marker{display:none}
details.zava>summary .z{display:none}
details.zava[open]>summary{margin-bottom:8px}
details.zava .say{display:grid;gap:8px}
.example{background:var(--card);border-radius:12px;padding:10px 14px;font-size:.93rem}
details.talk-box{border-top:1px dashed var(--line);padding-top:12px}
details.talk-box>summary{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:700;list-style:none;font-size:.92rem;color:var(--soft)}
details.talk-box>summary::-webkit-details-marker{display:none}
details.talk-box>summary .orb{display:none}
details.talk-box[open]>summary{margin-bottom:10px}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:800;font-size:.97rem}
.field .help{font-size:.87rem;color:var(--soft)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--k,var(--plans));box-shadow:0 0 0 3px color-mix(in srgb,var(--k,var(--plans)) 18%,transparent)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fields .wide{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--k,var(--plans));border-color:var(--k,var(--plans));color:var(--on)}
.chip small{font-weight:600;opacity:.8}

/* standards picker */
.std-tools{display:flex;gap:10px}
.std-tools input{flex:1}
.std-list{display:grid;gap:6px;max-height:420px;overflow:auto;padding:2px}
.std{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left}
.std.broad{background:var(--wash)}
.std.child{margin-left:24px}
.std[aria-pressed="true"]{border-color:var(--plans);background:color-mix(in srgb,var(--plans) 8%,var(--card))}
.std .code{font-weight:800;color:var(--plans);font-size:.9rem;min-width:50px}
.std .kind{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:800}
.chosen{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--plans) 8%,var(--card));border-radius:16px;padding:14px 16px}
.chosen .eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}

/* "I can" statements, check items */
.target-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.letter{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--plans) 14%,var(--card));color:var(--plans);display:grid;place-items:center;font-weight:800}
.letter.sm{width:26px;height:26px;font-size:.8rem}
.item-row{display:grid;grid-template-columns:auto minmax(0,1fr) 100px 150px auto;gap:10px;align-items:start;background:var(--wash);border-radius:16px;padding:12px}
.item-row .n{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--assess)}
.item-row textarea{min-height:56px}
.goal-sentence{font-size:clamp(1.1rem,2.2vw,1.35rem);font-weight:800;line-height:1.4;background:var(--wash);border-radius:16px;padding:16px 20px}
.goal-sentence mark{background:color-mix(in srgb,var(--assess) 18%,transparent);color:inherit;border-radius:6px;padding:0 4px}

/* scores */
.score-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table.scores{border-collapse:collapse;width:100%;min-width:520px}
table.scores th,table.scores td{padding:7px 8px;text-align:center;font-size:.92rem}
table.scores th{font-size:.8rem;color:var(--soft);font-weight:800;background:var(--wash)}
table.scores td:first-child,table.scores th:first-child{text-align:left}
table.scores tr+tr td{border-top:1px solid var(--line)}
table.scores input{width:62px;text-align:center;padding:6px;border-radius:10px}
table.scores input.sid{width:120px;text-align:left}
.got{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.85rem;border-radius:999px;padding:2px 10px}
.got .ico{width:13px;height:13px}
.got.yes{background:color-mix(in srgb,var(--good) 16%,transparent);color:color-mix(in srgb,var(--good) 75%,var(--ink))}
.got.no{background:color-mix(in srgb,var(--warn) 16%,transparent);color:color-mix(in srgb,var(--warn) 70%,var(--ink))}
.got.wait{background:var(--wash);color:var(--soft);font-weight:700}
.teacher-dots{display:flex;gap:8px;flex-wrap:wrap}
.tdot{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px 4px 4px;background:var(--wash);font-size:.86rem;font-weight:700}
.tdot i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-style:normal;font-size:.72rem}
.tdot.in i{background:var(--good);color:#fff}

/* results */
.big-ring{display:grid;place-items:center;position:relative;width:150px;height:150px;flex:none}
.big-ring svg{position:absolute;inset:0}
.big-ring b{font-size:2.1rem;font-weight:800;line-height:1}
.big-ring span{font-size:.82rem;color:var(--soft)}
.bars{display:grid;gap:14px}
.barrow{display:grid;grid-template-columns:auto minmax(0,1fr) 54px;gap:12px;align-items:center}
.barrow .track{height:14px;border-radius:999px;background:var(--wash);position:relative}
.barrow .track i{display:block;height:100%;border-radius:999px}
.barrow .track .goal{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:3px;background:var(--ink)}
.barrow .lab{font-size:.87rem;color:var(--soft);grid-column:2/4;margin-top:-8px}
.locked{display:flex;gap:14px;align-items:center;background:var(--wash);border-radius:16px;padding:16px 18px}
.card.bubble{background:var(--wash);border:0}
.card.bubble .eyebrow{color:var(--assess)!important}

/* invitations & shared strategies */
.invite{border-radius:20px;padding:20px 22px;display:grid;gap:12px;background:color-mix(in srgb,var(--good) 8%,var(--card));border:1.5px solid color-mix(in srgb,var(--good) 40%,var(--line))}
.invite .eyebrow{color:var(--good)!important}
.invite .vs{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vs-bar{display:grid;gap:4px;min-width:0;flex:1}
.vs-bar .bar i{background:var(--good)}
.vs-bar span{font-size:.84rem;color:var(--soft);display:flex;justify-content:space-between}
.strat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:12px}
.strat .who{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--soft)}
.strat blockquote{margin:0;font-size:1.03rem}
.strat .proof{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:800;color:color-mix(in srgb,var(--good) 75%,var(--ink));background:color-mix(in srgb,var(--good) 12%,transparent);padding:3px 11px;border-radius:999px}
.strat .proof .ico{width:15px;height:15px}

/* meetings */
.meet-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.clock{display:grid;place-items:center;position:relative;width:140px;height:140px;flex:none}
.clock svg{position:absolute;inset:0}
.clock b{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.clock span{font-size:.8rem;color:var(--soft);margin-top:-4px}
.agenda-item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.agenda-item .mins{font-weight:800;color:var(--meet);white-space:nowrap;font-size:.9rem}
.agenda-item textarea{min-height:60px}
.attend{display:flex;gap:8px;flex-wrap:wrap}
.todo-row{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px auto;gap:8px;align-items:center}
.meeting-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px 10px 10px;text-decoration:none}
.meeting-row:hover{border-color:var(--meet)}
.meeting-row .date{width:50px;height:50px;border-radius:12px;background:color-mix(in srgb,var(--meet) 14%,var(--card));display:grid;place-items:center;text-align:center;line-height:1;font-weight:800;color:var(--meet)}
.meeting-row .date small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}

/* glossary */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.word{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:8px}
.word .plc{font-size:.85rem;color:var(--soft);font-weight:700}

/* dialog, toast */
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);max-width:min(540px,calc(100vw - 32px));width:100%;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,24,32,.45)}
dialog form{display:grid;gap:16px;padding:26px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:.93rem;z-index:50}

@media (max-width:980px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}.meet-layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .doors,.grid2,.grid3,.fields{grid-template-columns:minmax(0,1fr)}
  .item-row{grid-template-columns:auto minmax(0,1fr)}
  .item-row>*:nth-child(n+3){grid-column:2}
  .todo-row{grid-template-columns:minmax(0,1fr)}
  .team-name{max-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function toast(text) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');

  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}

/* Builds a dialog from HTML. Resolves with the submitted FormData, or null if cancelled. */
function ask(html, { onOpen } = {}) {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.innerHTML = `<form method="dialog">${html}</form>`;
    document.body.append(d);
    const form = $('form', d);
    let result = null;
    form.addEventListener('submit', e => { e.preventDefault(); result = new FormData(form); d.close(); });
    $$('[data-cancel]', d).forEach(b => b.addEventListener('click', () => d.close()));
    d.addEventListener('close', () => { d.remove(); resolve(result); });
    d.showModal();
    onOpen && onOpen(d);
  });
}

const voice = {
  pick() {
    if (!window.speechSynthesis) return null;
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /en(-|_)US/i.test(v.lang) && /natural|samantha|aria|jenny|google/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  say(text, onEnd) {
    if (!window.speechSynthesis) { onEnd && setTimeout(onEnd, Math.max(3000, text.split(' ').length * 350)); return false; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = this.pick(); if (v) u.voice = v;
    u.rate = 0.98;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    speechSynthesis.speak(u);
    return true;
  },
  stop() { window.speechSynthesis && speechSynthesis.cancel(); }
};

const APP = { mode: 'local', status: 'saved', etag: '', wsId: '', root: '', directory: null, catalogs: {}, teamKey: 'demo', demo: false };

/* ---------------------------------------------------------------- standards */
function catalogStandards() {
  const out = [];
  for (const key of S.team.catalogs || []) {
    const cat = APP.catalogs[key]; if (!cat) continue;
    for (const s of cat.standards) out.push({ ...s, catalog: key, catalogTitle: cat.title || key });
  }
  return out;
}
const standardById = id => catalogStandards().find(s => s.id === id) || Object.values(APP.catalogs).flatMap(c => c.standards).find(s => s.id === id);
const isBroad = s => /\.0$/.test(s.code || '');
const parentCode = s => (s.code || '').replace(/\.\d+$/, '.0');

/* --------------------------------------------------------- scores & results */
/* Optional letter grade beside each percentage (standard 90/80/70/60 scale). */
const letterGrade = v => (v >= 90 ? 'A' : v >= 80 ? 'B' : v >= 70 ? 'C' : v >= 60 ? 'D' : 'F');
const scoreText = (p, v) => (p.scoreAs === 'letter' ? `${v}% · ${letterGrade(v)}` : `${v}%`);
const maxPoints = p => p.check.items.reduce((a, i) => a + (Number(i.points) || 0), 0);
function rowResult(p, row) {
  const items = p.check.items;
  if (!items.length) return { complete: false };
  const vals = items.map(i => row.s?.[i.id]);
  const complete = vals.every(v => v !== '' && v != null && !isNaN(Number(v)));
  const total = vals.reduce((a, v) => a + (Number(v) || 0), 0);
  const max = maxPoints(p);
  const per = {};
  for (const t of p.targets) {
    const its = items.filter(i => i.targetId === t.id);
    const tmax = its.reduce((a, i) => a + (Number(i.points) || 0), 0);
    if (!tmax) continue;
    const tgot = its.reduce((a, i) => a + (Number(row.s?.[i.id]) || 0), 0);
    per[t.id] = complete ? (100 * tgot) / tmax >= p.gotIt : null;
  }
  const score = max ? Math.round((100 * total) / max) : 0;
  return { complete, total, max, score, got: complete && max > 0 && (100 * total) / max >= p.gotIt, per };
}
function stats(p, { kind = 'first', teacherId = null } = {}) {
  const sets = p.scores.filter(s => (s.kind || 'first') === kind && (!teacherId || s.teacherId === teacherId));
  const rows = sets.flatMap(s => s.rows.map(r => ({ ...r, teacherId: s.teacherId })));
  const done = rows.map(r => ({ r, res: rowResult(p, r) })).filter(x => x.res.complete);
  const teachers = new Set(done.map(x => x.r.teacherId));
  const per = {};
  for (const t of p.targets) {
    const scored = done.filter(x => x.res.per[t.id] != null);
    per[t.id] = { n: scored.length, got: scored.filter(x => x.res.per[t.id]).length };
    per[t.id].pct = pct(per[t.id].got, per[t.id].n);
  }
  const got = done.filter(x => x.res.got).length;
  return { n: done.length, waiting: rows.length - done.length, got, pct: pct(got, done.length), teachers: teachers.size, per };
}
const PRIVACY_MIN_STUDENTS = 5, PRIVACY_MIN_TEACHERS = 3;
const teamUnlocked = st => st.n >= PRIVACY_MIN_STUDENTS && st.teachers >= PRIVACY_MIN_TEACHERS;

/* Invitations to share: offered only to a teacher whose students beat the team on an "I can" statement. */
function invitationsFor(teacherId) {
  if (!teacherId) return [];
  const out = [];
  for (const p of S.plans) {
    const team = stats(p); if (!teamUnlocked(team)) continue;
    const mine = stats(p, { teacherId }); if (mine.n < 3) continue;
    for (const t of p.targets) {
      const key = p.id + ':' + t.id, a = mine.per[t.id], b = team.per[t.id];
      if (!a || !b || !a.n || a.pct <= b.pct) continue;
      const answered = S.invites[teacherId]?.[key];
      const shared = S.strategies.some(s => s.planId === p.id && s.targetId === t.id && s.teacherId === teacherId);
      if (shared || answered === 'never' || (answered && answered.startsWith('later:') && answered.slice(6) > new Date().toISOString())) continue;
      out.push({ plan: p, target: t, mine: a.pct, team: b.pct, key });
    }
  }
  return out;
}

/* -------------------------------------------------------- step progress */
function stepState(p, key) {
  if (p.steps[key]?.done) return 100;
  const started = {
    skill: p.standardIds.length > 0, targets: p.targets.some(t => t.text.trim()), gotit: !!p.gotItNote,
    build: p.check.items.length > 0 || !!p.check.name, goal: !!p.goal.date, scores: p.scores.some(s => (s.kind || 'first') === 'first' && s.rows.length),
    results: !!p.results.notes, reteach: !!(p.reteach.how || p.reteach.leader), recheck: p.scores.some(s => s.kind === 'recheck' && s.rows.length),
    stretch: !!p.stretch.activity, wrap: !!p.wrap.reflection
  }[key];
  return started ? 50 : 0;
}
const famProgress = (p, fam) => { const ss = STEPS.filter(s => s.fam === fam); return Math.round(ss.reduce((a, s) => a + stepState(p, s.key), 0) / ss.length); };
const nextStep = p => STEPS.find(s => stepState(p, s.key) < 100) || STEPS[STEPS.length - 1];
const planDone = p => STEPS.every(s => stepState(p, s.key) === 100);
function planTitle(p) {
  const t = p.targets.find(t => t.text.trim());
  if (p.title) return p.title;
  if (t) return t.text;
  const s = p.standardIds.length && standardById(p.standardIds[0]);
  return s ? s.text : 'New plan';
}
const pipHTML = p => `<span class="pips" aria-label="Progress through the four questions">${Object.keys(FAMILIES).map(f => {
  const v = famProgress(p, f); return `<b class="f-${f} ${v >= 100 ? 'on' : v > 0 ? 'half' : ''}"></b>`; }).join('')}</span>`;
const tokHTML = (v, ic) => `<span class="tok ${v >= 100 ? 'done' : ''}" style="--p:${v}"><i>${icon(v >= 100 ? 'done' : v > 0 ? 'half' : ic || 'empty')}</i></span>`;

/* ------------------------------------------------------------------ meetings */
const runningMeeting = () => S.meetings.find(m => m.startedAt && !m.endedAt);
const lastMeeting = () => S.meetings.filter(m => m.endedAt).sort((a, b) => (a.endedAt < b.endedAt ? 1 : -1))[0] || null;
const openTodos = () => S.meetings.flatMap(m => (m.todos || []).map(t => ({ ...t, meetingId: m.id }))).filter(t => !t.done);
function suggestedAgenda(p) {
  const items = [{ id: uid(), topic: 'Check in and review our agreements', minutes: 5, kind: 'checkin', notes: '' }];
  if (openTodos().length) items.push({ id: uid(), topic: 'Follow up on last week\'s to-dos', minutes: 5, kind: 'todos', notes: '' });
  if (p) {
    const remaining = STEPS.filter(s => stepState(p, s.key) < 100);
    let left = 45 - items.reduce((a, i) => a + i.minutes, 0) - 7;
    for (const s of remaining) {
      if (left < 8) break;
      const m = Math.min(s.minutes, left);
      items.push({ id: uid(), topic: s.label, minutes: m, kind: 'step', planId: p.id, stepKey: s.key, notes: '' });
      left -= m;
    }
  }
  items.push({ id: uid(), topic: 'Wrap up: where we stopped and what\'s next', minutes: 7, kind: 'wrap', notes: '' });
  return items;
}

/* -------------------------------------------------------------- saving */
const bridge = window.__PLC || null;
let saveTimer = null;
function setStatus(s) {
  APP.status = s;
  const el = $('#saveStatus'); if (!el) return;
  el.className = 'status-dot ' + (s === 'saving' ? 'saving' : s === 'error' ? 'error' : '');
  el.querySelector('span').textContent = { saved: APP.mode === 'cloud' ? 'Saved online' : APP.demo ? 'Example team' : 'Saved in this browser', saving: 'Saving…', error: 'Not saved yet' }[s];
}
function save() {
  if (APP.mode === 'local') { store.set(localKey(), S); setStatus('saved'); return; }
  store.set('lp-pending:' + APP.wsId, S);
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCloud, 900);
}
const localKey = () => 'plc-launchpad-1:' + APP.teamKey;
async function api(method, path, body, headers = {}) {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...headers }, body: body == null ? undefined : JSON.stringify(body) });
  let data = {}; try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}
let saving = false, dirtyAgain = false;
async function saveCloud() {
  if (saving) { dirtyAgain = true; return; }
  saving = true;
  const snapshot = clone(S);
  try {
    const r = await api('PUT', '/api/demo/' + APP.wsId, { subject: APP.subject, catalogId: (S.team.catalogs || [])[0] || 'none', state: snapshot }, { 'If-Match': APP.etag });
    if (r.status === 409) { await resolveConflict(snapshot); return; }
    if (!r.ok) throw new Error(r.data.error || 'Save failed');
    APP.etag = r.data.etag;
    store.del('lp-pending:' + APP.wsId);
    setStatus('saved');
  } catch (e) {
    setStatus('error');
    toast((e && e.message) || 'Not saved yet. Launchpad will try again.');
    clearTimeout(saveTimer); saveTimer = setTimeout(saveCloud, 8000);
  } finally {
    saving = false;
    if (dirtyAgain) { dirtyAgain = false; saveCloud(); }
  }
}
/* Someone else saved first: keep a copy of ours in Version history, then load theirs. */
async function resolveConflict(mine) {
  await api('PUT', '/api/demo/' + APP.wsId + '?recovery=1', { subject: APP.subject, catalogId: (S.team.catalogs || [])[0] || 'none', state: mine });
  const r = await api('GET', '/api/demo/' + APP.wsId);
  if (r.ok && r.data.payload && !r.data.payload.fresh) { S = r.data.payload.state; APP.etag = r.data.etag; }
  store.del('lp-pending:' + APP.wsId);
  setStatus('saved');
  render();
  toast('A teammate saved at the same time. Their version is showing, and yours is kept in Version history.');
}

async function boot() {
  APP.catalogs = JSON.parse($('#catalogs').textContent);
  if (bridge) {
    if (bridge.ready) await bridge.ready;
    APP.mode = 'cloud';
    const params = bridge.params || {};
    APP.root = params.shared; APP.subject = params.course || 'engineering';
    try {
      const dir = await api('GET', '/api/directory/' + APP.root);
      if (dir.ok) APP.directory = dir.data;
      const look = await api('POST', '/api/demo/' + APP.root + '?course=' + encodeURIComponent(APP.subject));
      if (!look.ok) throw new Error(look.data.error || 'That team could not be opened.');
      APP.wsId = look.data.id;
      const got = await api('GET', '/api/demo/' + APP.wsId);
      if (!got.ok) throw new Error(got.data.error || 'That team could not be opened.');
      const team = APP.directory?.teams.find(t => (/^[0-9a-f-]{36}$/.test(t.id) ? 'team-' + t.id : t.id) === APP.subject);
      if (got.data.payload.fresh || got.data.payload.state?.schema !== 'launchpad-1') {
        S = blankState(team?.name || 'Our PLC team', '', team?.catalogs?.length ? team.catalogs : [APP.subject]);
        APP.etag = got.data.etag || '';
        if (!got.data.payload.fresh) APP.etag = got.data.etag; // older workspace: replaced on first save, kept in history
      } else { S = got.data.payload.state; APP.etag = got.data.etag; }
      const pending = store.get('lp-pending:' + APP.wsId);
      if (pending && pending.schema === 'launchpad-1' && JSON.stringify(pending) !== JSON.stringify(S)) { S = pending; save(); toast('Your unsaved changes from last time were restored.'); }
      const email = (bridge.email || '').toLowerCase();
      ME = S.members.find(m => (m.email || '').toLowerCase() === email)?.id || store.get('lp-me:' + APP.wsId);
    } catch (e) {
      document.body.innerHTML = `<main><div class="card" style="max-width:560px;margin:60px auto"><h2>This team couldn't be opened</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="plcReload()">Try again</button></div></main>`;
      return false;
    }
  } else {
    APP.mode = 'local';
    APP.teamKey = store.get('lp-current-team') || 'demo';
    S = store.get(localKey());
    if (!S || S.schema !== 'launchpad-1') { S = APP.teamKey === 'demo' ? sampleState() : blankState(); store.set(localKey(), S); }
    APP.demo = APP.teamKey === 'demo';
    ME = store.get('lp-me:' + APP.teamKey) || (APP.demo ? 'm1' : null);
  }
  return true;
}
function setMe(id) {
  ME = id;
  store.set('lp-me:' + (APP.mode === 'cloud' ? APP.wsId : APP.teamKey), id);
}

  if (r.page === 'meetings') out.push(['Meetings']);
  if (r.page === 'meeting') { const m = S.meetings.find(x => x.id === r.a); out.push(['Meetings', 'meetings'], [m ? fmtDate(m.date, { weekday: 'long', month: 'short', day: 'numeric' }) : 'Meeting']); }
  if (r.page === 'assess') { out.push(['Assessments & Results', r.a ? 'assess' : null]); if (p && r.b) out.push([{ build: 'Common assessment', scores: 'Enter scores', results: 'Team results' }[r.b] || '']); }

/* ---------- binding: inputs with data-bind write straight into the workspace ---------- */
function scopeObj(scope) {
  const r = route();
  if (scope === 'p') return planById(r.a);
  if (scope === 'm') return S.meetings.find(m => m.id === r.a);
  return S;
}
function walk(obj, path) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    o = k.startsWith('#') ? o.find(x => x.id === k.slice(1)) : (o[k] ??= {});
    if (o == null) return [null];
  }
  return [o, parts[parts.length - 1]];
}
function setPath(obj, path, val) { const [o, k] = walk(obj, path); if (o) o[k] = val; }
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) {
    const [scope, path] = el.dataset.bind.split(':');
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.type === 'number') v = v === '' ? '' : Number(v);
    setPath(scopeObj(scope), path, v);
    save();
    if (el.dataset.live) refreshLive(el.dataset.live, el);
  }
  if (el.matches('[data-filter]')) refreshLive(el.dataset.filter, el);
});
const LIVE = {};
function refreshLive(name, el) { (LIVE[name] || (() => {}))(el); }

/* PLC Launchpad 1.0 · the plan flight path and its eleven steps */

/* A plan opens as a checklist of the four questions. Each item opens one question on its own screen. */
const GROUPS = [
  ['learn', 1, 'What must every student learn?'],
  ['check', 2, 'How will we know they learned it?'],
  ['reteach', 3, 'What if a student isn\'t proficient yet?'],
  ['stretch', 4, 'What if a student is already proficient?']
];
function viewPlan(r) {
  const p = planById(r.a);
  if (!p) return `<div class="empty"><b>That plan isn't here anymore.</b><a class="btn" href="#plans">See our plans</a></div>`;
  if (S.activePlanId !== p.id) { S.activePlanId = p.id; save(); }
  if (r.b && step(r.b)) return stepScreen(p, step(r.b), 'plan');
  const n = nextStep(p), s = p.standardIds.length && standardById(p.standardIds[0]);
  const task = st => { const v = stepState(p, st.key); return `<a class="task" href="#plan-${p.id}-${st.key}"><span class="tick ${v === 100 ? 'on' : v > 0 ? 'half' : ''}">${v === 100 ? icon('done') : ''}</span><b>${esc(st.label)}</b>${st.key === n.key && !planDone(p) ? '<span class="next">Next up</span>' : `<span class="go">${icon('arrow')}</span>`}</a>`; };
  const groups = GROUPS.map(([fam, num, q]) => {
    const steps = STEPS.filter(x => x.fam === fam && x.key !== 'wrap');
    const done = steps.every(x => stepState(p, x.key) === 100);
    return `<section class="plan-q"><h3><span class="n ${done ? 'done' : ''}">${done ? icon('done') : num}</span>${esc(q)}</h3>${steps.map(task).join('')}</section>`;
  }).join('');
  const wrap = step('wrap');
  return `<div class="page-head"><div class="lead"><span class="small muted">${s ? esc(s.code) + ' · ' + esc(trimTo(s.text, 90)) : 'New plan'}</span><h1>${esc(planTitle(p))}</h1></div>
    ${planDone(p) ? '' : `<a class="btn big" href="#plan-${p.id}-${n.key}">Continue: ${esc(n.label)}${icon('arrow')}</a>`}</div>
    <div class="stack">${groups}<section class="plan-q"><h3><span class="n ${stepState(p, 'wrap') === 100 ? 'done' : ''}">${stepState(p, 'wrap') === 100 ? icon('done') : icon('goal')}</span>Finish</h3>${task(wrap)}</section></div>
    <div class="row" style="margin-top:18px"><button class="btn sm ghost" data-act="renamePlan">Rename plan</button><button class="btn sm danger" data-act="deletePlan">Delete plan</button></div>`;
}

/* One question per screen. ctx 'plan' walks the steps in order; ctx 'assess' returns to Assessments & Results. */
function stepScreen(p, st, ctx) {
  const idx = STEPS.indexOf(st), prev = STEPS[idx - 1], next = STEPS[idx + 1], fam = FAMILIES[st.fam];
  const done = stepState(p, st.key) === 100, talk = p.talk[st.key] || [], meeting = runningMeeting();
  const dots = STEPS.map((x, i) => `<a href="#plan-${p.id}-${x.key}" class="${x.key === st.key ? 'cur' : stepState(p, x.key) === 100 ? 'on' : ''}" title="Step ${i + 1}: ${esc(x.label)}" aria-label="Step ${i + 1}: ${esc(x.label)}"></a>`).join('');
  const top = ctx === 'plan'
    ? `<div class="q-top"><span>Question ${fam.n} · Step ${idx + 1} of ${STEPS.length}</span><span class="q-dots">${dots}</span></div>`
    : `<div class="q-top"><span>${esc(trimTo(planTitle(p), 60))}</span></div>`;
  const back = ctx === 'plan' ? `#plan-${p.id}` : '#assess';
  const main = ctx === 'plan'
    ? `<button class="btn big" data-act="saveNext" data-step="${st.key}">${next ? 'Save and continue' : 'Finish'}${icon('arrow')}</button>`
    : `<button class="btn big" data-act="saveBack" data-step="${st.key}">Save${icon('done')}</button>`;
  return `<div class="focus">${top}
    <section class="q-card" aria-labelledby="stepTitle">
      <h1 class="ask" id="stepTitle">${esc(st.q)}</h1>
      <p class="hint">${esc(st.what)}</p>
      <div>${termChip(st.term, st.fam)}</div>
      <div class="st-body">${(STEP_VIEWS[st.key] || (() => ''))(p)}</div>
      <details class="talk-box"><summary>${icon('note')}Team notes${talk.length ? ` (${talk.length})` : ''}${meeting ? ' · also saved to today\'s meeting' : ''}</summary>
        <div class="list" style="margin-bottom:10px">${talk.map(n => `<div class="li"><span class="avatar">${esc(initials(memberName(n.by)))}</span><span><b style="font-weight:600">${esc(n.text)}</b><span class="sub">${esc(memberName(n.by))} · ${esc(fmtDate(n.at))}</span></span><button class="icon-btn" aria-label="Delete note" data-act="delTalk" data-id="${n.id}">${icon('trash')}</button></div>`).join('')}</div>
        <div class="row"><input type="text" id="talkInput" placeholder="What did the team say or decide?" style="flex:1;min-width:200px"><button class="btn sm soft" data-act="addTalk">Add note</button></div>
      </details>
      <div class="q-foot">
        ${ctx === 'plan' && prev ? `<a class="btn ghost" href="#plan-${p.id}-${prev.key}">${icon('back')}Back</a>` : ''}
        <span class="spacer"></span>
        <a class="link-quiet" href="${back}">${ctx === 'plan' ? 'Back to plan' : 'Back to Assessments & Results'}</a>
        ${main}
      </div>
      ${done ? `<p class="done-note">${icon('done')}Done. <button type="button" class="linkish" data-act="undoStep" data-step="${st.key}">Mark not done</button></p>` : ''}
    </section></div>`;
}
const markDone = (p, key) => { if (!p.steps[key]?.done) p.steps[key] = { ...(p.steps[key] || {}), done: true, at: new Date().toISOString() }; save(); };
ACT.saveNext = b => {
  const p = planById(route().a), key = b.dataset.step; markDone(p, key);
  const next = STEPS[STEPS.indexOf(step(key)) + 1];
  if (next) { toast('Saved'); go(`plan-${p.id}-${next.key}`); } else { toast('Plan finished. Well done!'); go(`plan-${p.id}`); }
};
ACT.saveBack = b => { const p = planById(route().a); markDone(p, b.dataset.step); toast('Saved'); go('assess'); };
ACT.undoStep = b => { const p = planById(route().a); p.steps[b.dataset.step] = { done: false }; save(); render(); };
ACT.addTalk = () => {
  const input = $('#talkInput'), text = input.value.trim(); if (!text) { input.focus(); return; }
  const r = route(), p = planById(r.a), key = (step(r.b) || nextStep(p)).key;
  const note = { id: uid(), at: todayISO(), by: ME || '', text };
  (p.talk[key] ||= []).push(note);
  const m = runningMeeting();
  if (m) (m.stepNotes ||= []).push({ ...note, planId: p.id, stepKey: key });
  save(); render();
};
ACT.delTalk = b => { const r = route(), p = planById(r.a), key = (step(r.b) || nextStep(p)).key; p.talk[key] = (p.talk[key] || []).filter(n => n.id !== b.dataset.id); save(); render(); };

const STEP_VIEWS = {};

/* ---------------------------------------------------------------- 1 skill */
STEP_VIEWS.skill = p => {
  const chosen = p.standardIds.map(standardById).filter(Boolean);
  const why = [['Needed for what comes next', 'readiness'], ['Used in other subjects', 'leverage'], ['Lasts beyond this year', 'endurance'], ['On the state test', '']];
  return `${zava('Look for a skill students will use again and need for what comes next. If a big standard feels like too much for one plan, pick one skill inside it.',
      'Of 22 drafting standards, a team picks <b>B2.1 · sketching in three views</b>. Every later unit uses it, and a short check can show whether students are proficient.')}
    ${chosen.length ? chosen.map(s => `<div class="chosen"><span class="orb f-learn">${icon('standard')}</span><div class="stack" style="gap:4px"><span class="eyebrow" style="color:var(--learn)">Our must-learn skill · ${esc(s.code)}</span><b>${esc(s.text)}</b><span class="small muted">${esc(s.pathway || s.catalogTitle || '')}</span></div><button class="icon-btn" data-act="toggleStd" data-id="${s.id}" aria-label="Remove">${icon('close')}</button></div>`).join('') : ''}
    ${chosen.length ? `<div class="field f-learn"><span class="lbl">Why this skill made the cut</span><span class="help">Tap all that are true. PLC words: readiness, leverage, endurance.</span>
      <div class="chips">${why.map(([w, t]) => `<button type="button" class="chip" aria-pressed="${p.why.includes(w)}" data-act="toggleWhy" data-v="${esc(w)}">${esc(w)}${t ? ` <small>· ${t}</small>` : ''}</button>`).join('')}</div></div>` : ''}
    ${chosen.length && !APP.pickSkill ? `<div><button type="button" class="linkish" data-act="pickSkill">Choose a different skill</button></div>` : `<div class="field f-learn"><label for="stdSearch">Find the skill in your state standards</label>
      <div class="std-tools"><input type="search" id="stdSearch" placeholder="Search by word or code, like sketch or B2" data-filter="std"></div>
      <div class="std-list" id="stdList">${stdListHTML(p, '')}</div></div>`}`;
};
function stdListHTML(p, q) {
  const all = catalogStandards();
  if (!all.length) return `<div class="empty">No standards are set for this team. Choose them on the Team page.</div>`;
  const ql = q.trim().toLowerCase();
  const match = s => !ql || (s.code + ' ' + s.text + ' ' + (s.pathway || '')).toLowerCase().includes(ql);
  const out = [];
  for (const s of all) {
    const broad = isBroad(s);
    const kids = broad ? all.filter(k => !isBroad(k) && parentCode(k) === s.code && k.catalog === s.catalog) : [];
    if (!broad && all.some(b => isBroad(b) && b.code === parentCode(s) && b.catalog === s.catalog)) continue; // listed under its parent
    if (!match(s) && !kids.some(match)) continue;
    out.push(stdBtn(p, s, broad ? 'Big standard' : 'Skill'));
    for (const k of kids) if (match(k) || match(s)) out.push(stdBtn(p, k, 'One skill inside it', true));
  }
  return out.join('') || `<div class="empty">Nothing matches "${esc(q)}". Try a shorter word.</div>`;
}
const stdBtn = (p, s, kind, child) => `<button type="button" class="std ${isBroad(s) ? 'broad' : ''} ${child ? 'child' : ''}" aria-pressed="${p.standardIds.includes(s.id)}" data-act="toggleStd" data-id="${s.id}"><span class="code">${esc(s.code)}</span><span><span class="kind">${kind}</span>${esc(s.text)}</span></button>`;
LIVE.std = el => { const p = planById(route().a); $('#stdList').innerHTML = stdListHTML(p, el.value); };
ACT.toggleStd = b => {
  const p = planById(route().a), id = b.dataset.id;
  p.standardIds = p.standardIds.includes(id) ? p.standardIds.filter(x => x !== id) : [id];
  APP.pickSkill = false;
  save(); render(); if (p.standardIds.length) toast('Skill chosen.');
};
ACT.pickSkill = () => { APP.pickSkill = true; render(); setTimeout(() => $('#stdSearch')?.focus(), 30); };
ACT.toggleWhy = b => { const p = planById(route().a), v = b.dataset.v; p.why = p.why.includes(v) ? p.why.filter(x => x !== v) : [...p.why, v]; save(); render(); };

/* -------------------------------------------------------------- 2 targets */
STEP_VIEWS.targets = p => {
  const s = p.standardIds.length && standardById(p.standardIds[0]);
  if (!p.targets.length) p.targets.push({ id: uid(), text: '' });
  return `${s ? `<div class="chosen"><span class="orb sm f-learn">${icon('standard')}</span><div><span class="eyebrow" style="color:var(--learn)">Official wording · ${esc(s.code)}</span><p>${esc(s.text)}</p></div></div>` : `<div class="empty">Choose the skill first. <a class="btn sm" href="#plan-${p.id}-skill">Choose the skill</a></div>`}
    ${zava('Start with "I can". Use words a student would use, and name something you could see them do on a short check. Each statement gets a letter that follows it through the whole plan.',
      '<b>Official:</b> "Demonstrate the sketching process used in concept development."<br><b>A:</b> I can sketch the front, top and side views of a simple object.<br><b>B:</b> I can line up the views so their sizes match.')}
    <div class="stack" id="targetRows">${p.targets.map((t, i) => `<div class="target-row f-learn"><span class="letter">${LETTERS[i]}</span>
      <textarea id="t-${t.id}" data-bind="p:targets.#${t.id}.text" placeholder="I can…" aria-label="I can statement ${LETTERS[i]}" style="min-height:60px">${esc(t.text)}</textarea>
      <button class="icon-btn" data-act="delTarget" data-id="${t.id}" aria-label="Remove statement ${LETTERS[i]}">${icon('trash')}</button></div>`).join('')}</div>
    <div class="row">${p.targets.length < 4 ? `<button class="btn sm ghost" data-act="addTarget">${icon('plus')}Add another "I can"</button>` : ''}
      ${APP.mode === 'cloud' ? `<button class="btn sm fam f-learn" data-act="suggestTargets">${icon('guide')}Suggest wording</button>` : ''}</div>
    <div id="suggestions"></div>`;
};
ACT.addTarget = () => { const p = planById(route().a); p.targets.push({ id: uid(), text: '' }); save(); render(); };
ACT.delTarget = b => { const p = planById(route().a); p.targets = p.targets.filter(t => t.id !== b.dataset.id); p.check.items.forEach(i => { if (i.targetId === b.dataset.id) i.targetId = ''; }); save(); render(); };
ACT.suggestTargets = async b => {
  const p = planById(route().a), box = $('#suggestions');
  b.disabled = true; box.innerHTML = `<p class="muted">Zava is writing two suggestions…</p>`;
  const r = await api('POST', '/api/learning-targets', { teamId: APP.root, subject: APP.subject, planId: p.id, standards: p.standardIds.map(standardById).filter(Boolean).map(s => ({ code: s.code, text: s.text })), draft: p.targets.map(t => t.text).filter(Boolean).join('\n') });
  b.disabled = false;
  if (!r.ok) { box.innerHTML = `<p class="muted">${esc(r.data.error || 'Suggestions are unavailable right now.')}</p>`; return; }
  box.innerHTML = `<div class="stack">${r.data.suggestions.map(sg => `<div class="li f-learn" style="border-radius:22px"><span class="orb sm">${icon('guide')}</span><span><b style="font-weight:400">${esc(sg)}</b></span><button class="btn sm" data-act="useSuggestion" data-text="${esc(sg)}">Use this</button></div>`).join('')}</div>`;
};
ACT.useSuggestion = b => { const p = planById(route().a); const empty = p.targets.find(t => !t.text.trim()); if (empty) empty.text = b.dataset.text; else p.targets.push({ id: uid(), text: b.dataset.text }); save(); render(); };

/* ------------------------------------------------------ 3 proficiency score */
STEP_VIEWS.gotit = p => {
  const presets = [[70, 'C'], [75, ''], [80, 'B'], [90, 'A']];
  return `${zava('Decide this before anyone sees results, so every teacher sorts students the same way. Many teams use 75% or 80%.', 'On an 8-point check with a proficiency score of 75%, a student needs 6 points.', 'learn')}
    <div class="fields f-learn">
      <div class="field wide"><label for="gotIt">A student is proficient with a score of at least</label>
        <div class="row"><input id="gotIt" type="number" min="1" max="100" step="5" style="width:110px" data-type="number" data-bind="p:gotIt" data-live="gotit" value="${esc(p.gotIt)}"><b>%</b>
        <span class="chips">${presets.map(([v, g]) => `<button type="button" class="chip" aria-pressed="${Number(p.gotIt) === v}" data-act="setGotIt" data-v="${v}">${v}%${g ? ` <small>· ${g}</small>` : ''}</button>`).join('')}</span></div>
        <p id="gotItPoints" class="help">${gotItPoints(p)}</p></div>
      <div class="field wide"><span class="lbl">Show student scores as</span><div class="chips">
        <button type="button" class="chip" aria-pressed="${p.scoreAs !== 'letter'}" data-act="setScoreAs" data-v="percent">Percentage <small>· 88%</small></button>
        <button type="button" class="chip" aria-pressed="${p.scoreAs === 'letter'}" data-act="setScoreAs" data-v="letter">Percentage and letter grade <small>· 88% · B</small></button></div></div>
      <div class="field wide"><label for="gotNote">What does a proficient student's work look like?</label><span class="help">Describe it so any teacher on the team would score the same work the same way.</span>
        <textarea id="gotNote" data-bind="p:gotItNote" placeholder="A proficient student…">${esc(p.gotItNote)}</textarea></div>
    </div>`;
};
ACT.setGotIt = b => { const p = planById(route().a); p.gotIt = Number(b.dataset.v); save(); render(); };
ACT.setScoreAs = b => { const p = planById(route().a); p.scoreAs = b.dataset.v; save(); render(); };
const gotItPoints = p => { const m = maxPoints(p); return m ? `That's ${Math.ceil((m * p.gotIt) / 100)} of ${m} points on the common assessment${p.scoreAs === 'letter' ? `, a ${letterGrade(Number(p.gotIt) || 0)} or better` : ''}.` : 'Once the common assessment has points, Launchpad shows how many points that is.'; };
LIVE.gotit = () => { const el = $('#gotItPoints'); if (el) el.textContent = gotItPoints(planById(route().a)); };

/* ------------------------------------------------------------ 4 the check */
STEP_VIEWS.build = p => {
  const opts = id => `<option value="">Which "I can"?</option>` + p.targets.map((t, i) => `<option value="${t.id}" ${t.id === id ? 'selected' : ''}>${LETTERS[i]} · ${esc(t.text.slice(0, 40) || 'statement ' + LETTERS[i])}</option>`).join('');
  return `${zava('Keep it short: four to six questions is plenty. Give it on the same day in every class if you can, and tie every question to an "I can" statement so results show which part students missed.', '', 'check')}
    <div class="fields f-check">
      <div class="field"><label for="ckName">Name of the check</label><input id="ckName" type="text" data-bind="p:check.name" value="${esc(p.check.name)}" placeholder="Three-view sketch check"></div>
      <div class="field"><label for="ckDate">Day every class takes it</label><input id="ckDate" type="date" data-bind="p:check.date" value="${esc(p.check.date)}"></div>
    </div>
    <div class="stack f-check" id="items">${p.check.items.map((it, i) => `<div class="item-row">
      <span class="n">${i + 1}</span>
      <textarea id="ip-${it.id}" data-bind="p:check.items.#${it.id}.prompt" aria-label="Question ${i + 1}" placeholder="Question or task">${esc(it.prompt)}</textarea>
      <input type="number" min="0" step="1" aria-label="Points for question ${i + 1}" data-type="number" data-bind="p:check.items.#${it.id}.points" data-live="points" value="${esc(it.points)}" placeholder="Points">
      <select aria-label="I can statement for question ${i + 1}" data-bind="p:check.items.#${it.id}.targetId">${opts(it.targetId)}</select>
      <button class="icon-btn" data-act="delItem" data-id="${it.id}" aria-label="Remove question ${i + 1}">${icon('trash')}</button>
      <textarea style="grid-column:2/-1;min-height:48px" data-bind="p:check.items.#${it.id}.guide" aria-label="Scoring guide for question ${i + 1}" placeholder="Scoring guide (teachers only): what earns each point">${esc(it.guide || '')}</textarea>
    </div>`).join('')}</div>
    <div class="row"><button class="btn sm fam f-check" data-act="addItem">${icon('plus')}Add a question</button><span class="spacer"></span><b id="totalPts">${maxPoints(p)} points in all</b></div>
    ${!p.targets.some(t => t.text) ? `<p class="small muted">Tip: write your "I can" statements first so each question can be tied to one.</p>` : ''}`;
};
ACT.addItem = () => { const p = planById(route().a); p.check.items.push({ id: uid(), prompt: '', points: 1, targetId: p.targets[0]?.id || '', guide: '' }); save(); render(); setTimeout(() => $$('#items textarea')[$$('#items textarea').length - 2]?.focus(), 30); };
ACT.delItem = b => { const p = planById(route().a); p.check.items = p.check.items.filter(i => i.id !== b.dataset.id); save(); render(); };
LIVE.points = () => { const el = $('#totalPts'); if (el) el.textContent = maxPoints(planById(route().a)) + ' points in all'; };

/* ------------------------------------------------------------ 5 team goal */
STEP_VIEWS.goal = p => `${zava('A good goal is a stretch but reachable. If you gave a pre-check, enter where students started so you can see growth.', 'By Dec 3, 80% of our students will score 75% or higher on the three-view sketch check, up from 40%.', 'check')}
  <div class="fields f-check">
    <div class="field"><label for="gTarget">Share of students who will be proficient</label><div class="row"><input id="gTarget" type="number" min="1" max="100" step="5" style="width:110px" data-type="number" data-bind="p:goal.target" data-live="goal" value="${esc(p.goal.target)}"><b>%</b></div></div>
    <div class="field"><label for="gDate">By this date</label><input id="gDate" type="date" data-bind="p:goal.date" data-live="goal" value="${esc(p.goal.date)}"></div>
    <div class="field"><label for="gBase">Where students started (optional)</label><span class="help">PLC word: baseline</span><div class="row"><input id="gBase" type="number" min="0" max="100" style="width:110px" data-type="number" data-bind="p:goal.baseline" data-live="goal" value="${esc(p.goal.baseline)}"><b>%</b></div></div>
  </div>
  <div class="field"><span class="lbl">Our team goal</span><p class="goal-sentence" id="goalSentence">${goalSentence(p)}</p></div>`;
function goalSentence(p) {
  const d = p.goal.date ? fmtDate(p.goal.date, { month: 'long', day: 'numeric' }) : '<mark>a date</mark>';
  return `By ${p.goal.date ? `<mark>${esc(d)}</mark>` : d}, <mark>${esc(p.goal.target || '?')}%</mark> of our students will score <mark>${esc(p.gotIt)}% or higher</mark> on ${p.check.name ? `the <mark>${esc(p.check.name)}</mark>` : 'our common assessment'}${p.goal.baseline !== '' && p.goal.baseline != null ? `, up from <mark>${esc(p.goal.baseline)}%</mark>` : ''}.`;
}
LIVE.goal = () => { const el = $('#goalSentence'); if (el) el.innerHTML = goalSentence(planById(route().a)); };

/* --------------------------------------------------------------- 6 scores */
STEP_VIEWS.scores = p => scoresView(p, 'first');
function scoresView(p, kind) {
  if (!p.check.items.length) return `<div class="empty">${icon('check')}<b>Build the common assessment first</b><span>Scores are entered for each question on the check.</span><a class="btn fam f-check" href="#plan-${p.id}-build">Build the common assessment</a></div>`;
  const me = member(ME);
  const entry = S.members.map(m => { const st = stats(p, { kind, teacherId: m.id }); return `<span class="tdot ${st.n ? 'in' : ''}"><i>${esc(initials(m.name))}</i>${esc(m.name)} · ${st.n ? plural(st.n, 'student') : 'not yet'}</span>`; }).join('');
  if (!me) return `<div class="teacher-dots">${entry}</div><div class="empty">${icon('person')}<b>Which teacher are you?</b><span>You enter scores for your own classes only.</span><button class="btn" data-act="whoAmI">Choose your name</button></div>`;
  const sets = p.scores.filter(s => s.teacherId === ME && (s.kind || 'first') === kind);
  const intro = kind === 'recheck'
    ? zava('Re-check only the students who weren\'t proficient the first time. Launchpad adds them for you.', '', 'reteach')
    : zava('Enter a score for each question. The total and percentage fill in on their own, green when a student is proficient. You can paste straight from a spreadsheet: student ID first, then one column per question.', '', 'check');
  return `${intro}
    <div class="row"><span class="small muted">Who has entered:</span><div class="teacher-dots">${entry}</div></div>
    ${privacyNote('Use student ID numbers, not names. Your teammates never see your students\' rows, only team totals.')}
    ${sets.map(set => scoreTable(p, set)).join('') || `<div class="empty">No classes yet.</div>`}
    <div class="row"><button class="btn fam ${kind === 'recheck' ? 'f-reteach' : 'f-check'}" data-act="addSet" data-kind="${kind}">${icon('plus')}${kind === 'recheck' ? 'Start my re-check list' : sets.length ? 'Add another class' : 'Add my first class'}</button></div>`;
}
function scoreTable(p, set) {
  const items = p.check.items;
  return `<div class="stack"><div class="row"><span class="orb sm f-check">${icon('score')}</span><input type="text" aria-label="Class name" data-bind="p:scores.#${set.id}.period" value="${esc(set.period)}" style="max-width:220px" placeholder="Class period">
    <span class="spacer"></span><button class="btn sm ghost" data-act="pasteRows" data-set="${set.id}">${icon('paste')}Paste from a spreadsheet</button><button class="btn sm danger" data-act="delSet" data-set="${set.id}">${icon('trash')}Remove class</button></div>
    <div class="score-wrap"><table class="scores"><thead><tr><th scope="col">Student ID</th>${items.map((it, i) => `<th scope="col" title="${esc(it.prompt)}">Q${i + 1}<br><span class="muted">/${esc(it.points)}${it.targetId ? ' · ' + LETTERS[p.targets.findIndex(t => t.id === it.targetId)] : ''}</span></th>`).join('')}<th scope="col">Points</th><th scope="col">Score</th><th></th></tr></thead>
    <tbody>${set.rows.map(row => scoreRow(p, set, row)).join('')}</tbody></table></div>
    <div><button class="btn sm soft" data-act="addRow" data-set="${set.id}">${icon('plus')}Add a student</button></div></div>`;
}
function scoreRow(p, set, row) {
  const res = rowResult(p, row);
  return `<tr id="row-${row.id}"><td><input class="sid" type="text" aria-label="Student ID" data-bind="p:scores.#${set.id}.rows.#${row.id}.student" value="${esc(row.student)}"></td>
    ${p.check.items.map((it, i) => `<td><input type="number" min="0" max="${esc(it.points)}" aria-label="Student ${esc(row.student)} question ${i + 1}" data-type="number" data-bind="p:scores.#${set.id}.rows.#${row.id}.s.${it.id}" data-live="row" data-row="${row.id}" data-set="${set.id}" value="${esc(row.s?.[it.id] ?? '')}"></td>`).join('')}
    <td class="num" data-total>${res.complete ? `${res.total}/${res.max}` : '–'}</td><td data-got>${gotPill(res, p)}</td>
    <td><button class="icon-btn" data-act="delRow" data-set="${set.id}" data-row="${row.id}" aria-label="Remove student">${icon('close')}</button></td></tr>`;
}
const gotPill = (res, p) => res.complete ? `<span class="got ${res.got ? 'yes' : 'no'}" title="${res.got ? 'Proficient' : 'Not yet proficient'}">${res.got ? icon('done') : ''}${scoreText(p, res.score)}</span>` : `<span class="got wait">Not scored yet</span>`;
LIVE.row = el => {
  const p = planById(route().a), set = p.scores.find(s => s.id === el.dataset.set), row = set.rows.find(r => r.id === el.dataset.row);
  const res = rowResult(p, row), tr = $('#row-' + row.id);
  $('[data-total]', tr).textContent = res.complete ? `${res.total}/${res.max}` : '–';
  $('[data-got]', tr).innerHTML = gotPill(res, p);
};
ACT.addSet = b => {
  const p = planById(route().a), kind = b.dataset.kind, me = member(ME);
  const set = { id: uid(), teacherId: ME, period: kind === 'recheck' ? 'Re-check' : (me?.periods ? 'Period ' + String(me.periods).split(/[,\s]+/)[p.scores.filter(s => s.teacherId === ME).length] || 'My class' : 'My class'), kind, rows: [] };
  if (kind === 'recheck') {
    for (const s of p.scores.filter(s => s.teacherId === ME && (s.kind || 'first') === 'first'))
      for (const r of s.rows) { const res = rowResult(p, r); if (res.complete && !res.got) set.rows.push({ id: uid(), student: r.student, s: {} }); }
    if (!set.rows.length) { toast('None of your students need a re-check.'); return; }
  } else set.rows.push({ id: uid(), student: '', s: {} });
  p.scores.push(set); save(); render();
};
ACT.delSet = async b => {
  const ok = await ask(`<h2>Remove this class?</h2><p class="muted">Its scores will be deleted. Version history keeps earlier saves.</p><div class="row end"><button type="button" class="btn ghost" data-cancel>Keep it</button><button class="btn danger">Remove class</button></div>`);
  if (!ok) return; const p = planById(route().a); p.scores = p.scores.filter(s => s.id !== b.dataset.set); save(); render();
};
ACT.addRow = b => { const p = planById(route().a), set = p.scores.find(s => s.id === b.dataset.set); const row = { id: uid(), student: '', s: {} }; set.rows.push(row); save(); render(); setTimeout(() => $(`#row-${row.id} .sid`)?.focus(), 30); };
ACT.delRow = b => { const p = planById(route().a), set = p.scores.find(s => s.id === b.dataset.set); set.rows = set.rows.filter(r => r.id !== b.dataset.row); save(); render(); };
ACT.pasteRows = async b => {
  const p = planById(route().a), set = p.scores.find(s => s.id === b.dataset.set);
  const fd = await ask(`<h2>Paste scores</h2><p class="muted">Copy rows from your spreadsheet: the student ID first, then one column for each of the ${p.check.items.length} questions, in order.</p>
    <textarea name="rows" rows="8" placeholder="1001&#9;2&#9;1&#9;2&#9;2" style="font-family:ui-monospace,monospace" required></textarea>
    <div class="row end"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn">Add these students</button></div>`);
  if (!fd) return;
  let added = 0;
  for (const line of String(fd.get('rows')).split(/\r?\n/)) {
    const cells = line.split(/\t|,/).map(c => c.trim()); if (!cells[0]) continue;
    const s = {}; p.check.items.forEach((it, i) => { const v = cells[i + 1]; if (v !== undefined && v !== '' && !isNaN(Number(v))) s[it.id] = Number(v); });
    set.rows = set.rows.filter(r => r.student || Object.keys(r.s).length);
    set.rows.push({ id: uid(), student: cells[0], s }); added++;
  }
  save(); render(); toast(`${plural(added, 'student')} added.`);
};

/* -------------------------------------------------------------- 7 results */
STEP_VIEWS.results = p => {
  const team = stats(p), mine = ME ? stats(p, { teacherId: ME }) : null;
  const inv = invitationsFor(ME).filter(i => i.plan.id === p.id);
  const discuss = [['Discuss', 'Which "I can" statement was hardest? What did we expect?'], ['Look at student work', 'Compare one strong and one missed answer. What is the error?'], ['Decide together', 'Who needs reteaching, and what will we do differently?']];
  return `${resultsPanel(p, team, mine)}
    ${inv.map(inviteCard).join('')}
    <div class="grid3">${discuss.map(([h, q], i) => `<div class="card bubble"><span class="eyebrow" style="color:var(--check)">${i + 1} · ${h}</span><p>${q}</p></div>`).join('')}</div>
    <div class="fields f-check"><div class="field wide"><label for="rNotes">What we noticed</label><textarea id="rNotes" data-bind="p:results.notes" placeholder="Most students drew the right views, but in the wrong places…">${esc(p.results.notes)}</textarea></div>
      <div class="field wide"><label for="rDec">What we decided</label><textarea id="rDec" data-bind="p:results.decision" placeholder="Reteach target B in small groups on Tuesday…">${esc(p.results.decision)}</textarea></div></div>`;
};
function resultsPanel(p, team, mine, compact) {
  if (!p.check.items.length || !team.n) return `<div class="locked">${icon('results')}<div><b>No scores yet</b><p class="small muted">Results appear once teachers enter scores.</p></div></div>`;
  if (!teamUnlocked(team)) return `<div class="locked">${icon('lock')}<div><b>Team results are hidden for now</b><p class="small muted">To protect privacy, they appear once at least ${PRIVACY_MIN_STUDENTS} students from ${PRIVACY_MIN_TEACHERS} teachers are scored. So far: ${plural(team.n, 'student')} from ${plural(team.teachers, 'teacher')}.</p></div></div>
    ${mine && mine.n ? myLine(mine) : ''}`;
  const R = 74, C = 2 * Math.PI * R, goal = Number(p.goal.target) || 0;
  const ring = `<div class="big-ring f-check"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--wash)" stroke-width="14"/>
    <circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--check)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - team.pct / 100)}" transform="rotate(-90 85 85)"/>
    ${goal ? `<line x1="85" y1="4" x2="85" y2="22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" transform="rotate(${goal * 3.6} 85 85)"/>` : ''}</svg>
    <b class="num">${team.pct}%</b><span>proficient</span></div>`;
  const bars = p.targets.map((t, i) => { const s = team.per[t.id]; if (!s || !s.n) return ''; return `<div class="barrow f-learn"><span class="letter sm">${LETTERS[i]}</span>
    <div class="track"><i style="width:${s.pct}%;background:var(--check)"></i>${goal ? `<span class="goal" style="left:${goal}%" title="Team goal ${goal}%"></span>` : ''}</div><b class="num">${s.pct}%</b>
    <span class="lab">${esc(t.text)}</span></div>`; }).join('');
  return `<div class="card f-check" style="background:var(--paper)"><div class="row" style="align-items:center;gap:26px">${ring}
      <div class="stack" style="flex:1;min-width:240px"><div><span class="eyebrow">Whole team · ${plural(team.n, 'student')} · ${plural(team.teachers, 'teacher')}</span>
      <h3 style="margin-top:4px">${team.got} of ${team.n} students proficient (${esc(p.gotIt)}% or higher)${goal ? ` · goal ${goal}%` : ''}</h3>${team.waiting ? `<p class="small muted">${plural(team.waiting, 'row')} not scored yet are left out.</p>` : ''}</div>
      ${compact ? '' : `<div class="bars">${bars}</div>`}</div></div>
    ${mine && mine.n ? myLine(mine, team) : ''}</div>`;
}
function myLine(mine, team) {
  return `<div class="li" style="border-radius:22px;background:var(--wash)"><span class="orb sm f-tool">${icon('lock')}</span><span><b>Your students: ${mine.pct}% proficient${team ? ` · team ${team.pct}%` : ''}</b><span class="sub">Only you see this line.</span></span><span></span></div>`;
}

/* -------------------------------------------------------------- 8 reteach */
STEP_VIEWS.reteach = p => {
  const team = stats(p);
  const groups = p.targets.map((t, i) => { const s = team.per[t.id]; return s && s.n ? `<div class="li f-reteach" style="border-radius:22px"><span class="letter sm" style="background:var(--reteach);color:var(--on-reteach)">${LETTERS[i]}</span><span><b>${s.n - s.got} students need reteaching</b><span class="sub">${esc(t.text)}</span></span><span></span></div>` : ''; }).join('');
  const myKids = ME ? p.scores.filter(s => s.teacherId === ME && (s.kind || 'first') === 'first').flatMap(s => s.rows).filter(r => { const x = rowResult(p, r); return x.complete && !x.got; }).map(r => r.student) : [];
  const ideas = S.strategies.filter(s => s.planId === p.id || p.targets.some(t => t.id === s.targetId)).concat(S.strategies.filter(s => s.planId !== p.id)).slice(0, 3);
  return `${zava('Teaching it again the same way rarely works. Try a hands-on model, a visual, or a small group with a different teacher. Your teammates\' shared ideas are below.', '', 'reteach')}
    ${teamUnlocked(team) ? `<div class="stack">${groups}</div>` : `<div class="locked">${icon('lock')}<div><b>Group sizes appear with team results</b><p class="small muted">Once ${PRIVACY_MIN_STUDENTS} students from ${PRIVACY_MIN_TEACHERS} teachers are scored.</p></div></div>`}
    ${myKids.length ? `<div class="li" style="border-radius:22px"><span class="orb sm f-tool">${icon('lock')}</span><span><b>Your students for reteaching: ${myKids.map(esc).join(', ')}</b><span class="sub">Only you see these IDs.</span></span><span></span></div>` : ''}
    <div class="fields f-reteach">
      <div class="field"><label for="rtLead">Who leads the reteach group?</label><select id="rtLead" data-bind="p:reteach.leader"><option value="">Choose…</option>${S.members.map(m => `<option value="${m.id}" ${p.reteach.leader === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}<option value="each" ${p.reteach.leader === 'each' ? 'selected' : ''}>Each teacher with their own students</option></select></div>
      <div class="field"><label for="rtWhen">When?</label><input id="rtWhen" type="text" data-bind="p:reteach.when" value="${esc(p.reteach.when)}" placeholder="Tuesday and Thursday, first 20 minutes"></div>
      <div class="field wide"><label for="rtHow">The new way we'll teach it</label><textarea id="rtHow" data-bind="p:reteach.how" placeholder="Students hold a real block and trace each face onto grid paper…">${esc(p.reteach.how)}</textarea></div>
    </div>
    ${ideas.length ? `<div class="stack"><h3>${icon('practice')} Ideas from your team</h3>${ideas.map(stratCard).join('')}</div>` : ''}`;
};

/* --------------------------------------------------------------- 9 re-check */
STEP_VIEWS.recheck = p => {
  const re = stats(p, { kind: 'recheck' });
  return `${scoresView(p, 'recheck')}
    ${re.n ? `<div class="card f-reteach" style="background:var(--paper)"><h3>${re.got} of ${re.n} retaught students are now proficient</h3><p class="small muted">Across the whole team. ${teamUnlocked(stats(p)) ? '' : 'Individual classes are never shown.'}</p></div>` : ''}`;
};

/* --------------------------------------------------------------- 10 stretch */
STEP_VIEWS.stretch = p => {
  const ways = ['On their own', 'With a partner', 'Small group', 'Teach it back'];
  return `${zava('A good stretch asks "why" or "what if" with the same skill. Avoid simply handing out more problems of the same kind. It runs while other students are retaught, so nobody waits.', 'Sketch an object with a hidden hole, show it with hidden lines, and explain your choice to a partner.', 'stretch')}
    <div class="fields f-stretch">
      <div class="field wide"><label for="stAct">The stretch activity</label><textarea id="stAct" data-bind="p:stretch.activity" placeholder="Students who are already proficient will…">${esc(p.stretch.activity)}</textarea></div>
      <div class="field wide"><span class="lbl">How students work on it</span><div class="chips">${ways.map(w => `<button type="button" class="chip" aria-pressed="${p.stretch.how.includes(w)}" data-act="toggleWay" data-v="${esc(w)}">${w}</button>`).join('')}</div></div>
      <div class="field wide"><label for="stMat">Materials link (optional)</label><input id="stMat" type="url" data-bind="p:stretch.materials" value="${esc(p.stretch.materials)}" placeholder="https://"></div>
    </div>`;
};
ACT.toggleWay = b => { const p = planById(route().a), v = b.dataset.v; p.stretch.how = p.stretch.how.includes(v) ? p.stretch.how.filter(x => x !== v) : [...p.stretch.how, v]; save(); render(); };

/* ----------------------------------------------------------------- 11 wrap */
function finalStats(p) {
  const team = stats(p); if (!team.n) return team;
  const re = p.scores.filter(s => s.kind === 'recheck');
  let got = team.got;
  for (const set of re) for (const r of set.rows) {
    const res = rowResult(p, r); if (!res.complete || !res.got) continue;
    const first = p.scores.filter(s => s.teacherId === set.teacherId && (s.kind || 'first') === 'first').flatMap(s => s.rows).find(x => x.student === r.student);
    if (first && !rowResult(p, first).got) got++;
  }
  return { ...team, got, pct: pct(got, team.n) };
}
STEP_VIEWS.wrap = p => {
  const f = finalStats(p), goal = Number(p.goal.target) || 0;
  const met = teamUnlocked(f) && goal && f.pct >= goal;
  return `<div class="card f-stretch" style="background:var(--paper)">
      ${teamUnlocked(f) ? `<span class="eyebrow">After reteaching</span><h3 style="font-size:1.6rem">${f.pct}% of students are proficient${goal ? ` · goal ${goal}%` : ''}</h3>
      <p>${goal ? (met ? 'You reached your team goal. Celebrate it together!' : `You're ${goal - f.pct} points from your goal.`) : ''}</p>` : `<div class="locked">${icon('lock')}<div><b>Results appear once enough scores are in</b></div></div>`}
    </div>
    ${zava('Take five minutes to name what worked. Then decide whether to keep going with this skill or start the next one.', '', 'stretch')}
    <div class="fields f-stretch">
      <div class="field wide"><label for="wRef">What did we learn as a team?</label><textarea id="wRef" data-bind="p:wrap.reflection" placeholder="Hands-on models worked better than the worksheet…">${esc(p.wrap.reflection)}</textarea></div>
      <div class="field wide"><span class="lbl">What's next?</span><div class="chips">${['Start the next must-learn skill', 'Keep working on this skill', 'Revisit later in the year'].map(w => `<button type="button" class="chip" aria-pressed="${p.wrap.next === w}" data-act="setNext" data-v="${esc(w)}">${w}</button>`).join('')}</div></div>
    </div>
    ${p.wrap.next === 'Start the next must-learn skill' ? `<div><button class="btn fam f-learn" data-act="newPlan">${icon('plus')}Start the next plan</button></div>` : ''}`;
};
ACT.setNext = b => { const p = planById(route().a); p.wrap.next = b.dataset.v; save(); render(); };

const stopOptions = m => { const p = planById(m.planId); return p ? STEPS.map(s => `<option value="${s.key}" ${m.stoppedAt?.stepKey === s.key ? 'selected' : ''}>${esc(s.label)}</option>`).join('') : '<option value="">No plan</option>'; };

function clockHTML() {
