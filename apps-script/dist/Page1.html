/* Builds a dialog from HTML. Resolves with the submitted FormData, or null if cancelled. */
function ask(html, { onOpen } = {}) {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.innerHTML = `<form method="dialog">${html}</form>`;
    document.body.append(d);
    const form = $('form', d);
    let result = null;
    form.addEventListener('submit', e => { e.preventDefault(); result = new FormData(form); d.close(); });
    $$('[data-cancel]', d).forEach(b => b.addEventListener('click', () => d.close()));
    d.addEventListener('close', () => { d.remove(); resolve(result); });
    d.showModal();
    onOpen && onOpen(d);
  });
}

const voice = {

    if (!window.speechSynthesis) return null;

    return vs.find(v => /en(-|_)US/i.test(v.lang) && /natural|samantha|aria|jenny|google/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  say(text, onEnd) {
    if (!window.speechSynthesis) { onEnd && setTimeout(onEnd, Math.max(3000, text.split(' ').length * 350)); return false; }
    speechSynthesis.cancel();

    u.rate = 0.98;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    speechSynthesis.speak(u);
    return true;
  },
  stop() { window.speechSynthesis && speechSynthesis.cancel(); }
};

/* --------------------------------------------------------- scores & results */
const maxPoints = p => p.check.items.reduce((a, i) => a + (Number(i.points) || 0), 0);
function rowResult(p, row) {
  const items = p.check.items;
  if (!items.length) return { complete: false };
  const vals = items.map(i => row.s?.[i.id]);
  const complete = vals.every(v => v !== '' && v != null && !isNaN(Number(v)));
  const total = vals.reduce((a, v) => a + (Number(v) || 0), 0);
  const max = maxPoints(p);
  const per = {};
  for (const t of p.targets) {
    const its = items.filter(i => i.targetId === t.id);
    const tmax = its.reduce((a, i) => a + (Number(i.points) || 0), 0);
    if (!tmax) continue;
    const tgot = its.reduce((a, i) => a + (Number(row.s?.[i.id]) || 0), 0);
    per[t.id] = complete ? (100 * tgot) / tmax >= p.gotIt : null;
  }
  return { complete, total, max, got: complete && max > 0 && (100 * total) / max >= p.gotIt, per };
}
function stats(p, { kind = 'first', teacherId = null } = {}) {
  const sets = p.scores.filter(s => (s.kind || 'first') === kind && (!teacherId || s.teacherId === teacherId));
  const rows = sets.flatMap(s => s.rows.map(r => ({ ...r, teacherId: s.teacherId })));
  const done = rows.map(r => ({ r, res: rowResult(p, r) })).filter(x => x.res.complete);
  const teachers = new Set(done.map(x => x.r.teacherId));
  const per = {};
  for (const t of p.targets) {
    const scored = done.filter(x => x.res.per[t.id] != null);
    per[t.id] = { n: scored.length, got: scored.filter(x => x.res.per[t.id]).length };
    per[t.id].pct = pct(per[t.id].got, per[t.id].n);
  }
  const got = done.filter(x => x.res.got).length;
  return { n: done.length, waiting: rows.length - done.length, got, pct: pct(got, done.length), teachers: teachers.size, per };
}
const PRIVACY_MIN_STUDENTS = 5, PRIVACY_MIN_TEACHERS = 3;
const teamUnlocked = st => st.n >= PRIVACY_MIN_STUDENTS && st.teachers >= PRIVACY_MIN_TEACHERS;

/* Invitations to share: offered only to a teacher whose students beat the team on an "I can" statement. */
function invitationsFor(teacherId) {
  if (!teacherId) return [];
  const out = [];
  for (const p of S.plans) {
    const team = stats(p); if (!teamUnlocked(team)) continue;
    const mine = stats(p, { teacherId }); if (mine.n < 3) continue;
    for (const t of p.targets) {
      const key = p.id + ':' + t.id, a = mine.per[t.id], b = team.per[t.id];
      if (!a || !b || !a.n || a.pct <= b.pct) continue;
      const answered = S.invites[teacherId]?.[key];
      const shared = S.strategies.some(s => s.planId === p.id && s.targetId === t.id && s.teacherId === teacherId);
      if (shared || answered === 'never' || (answered && answered.startsWith('later:') && answered.slice(6) > new Date().toISOString())) continue;
      out.push({ plan: p, target: t, mine: a.pct, team: b.pct, key });
    }
  }
  return out;
}

/* ------------------------------------------------------------------ meetings */
const runningMeeting = () => S.meetings.find(m => m.startedAt && !m.endedAt);
const lastMeeting = () => S.meetings.filter(m => m.endedAt).sort((a, b) => (a.endedAt < b.endedAt ? 1 : -1))[0] || null;
const openTodos = () => S.meetings.flatMap(m => (m.todos || []).map(t => ({ ...t, meetingId: m.id }))).filter(t => !t.done);
function suggestedAgenda(p) {
  const items = [{ id: uid(), topic: 'Check in and review our agreements', minutes: 5, kind: 'checkin', notes: '' }];
  if (openTodos().length) items.push({ id: uid(), topic: 'Follow up on last week\'s to-dos', minutes: 5, kind: 'todos', notes: '' });
  if (p) {
    const remaining = STEPS.filter(s => stepState(p, s.key) < 100);
    let left = 45 - items.reduce((a, i) => a + i.minutes, 0) - 7;
    for (const s of remaining) {
      if (left < 8) break;
      const m = Math.min(s.minutes, left);
      items.push({ id: uid(), topic: s.label, minutes: m, kind: 'step', planId: p.id, stepKey: s.key, notes: '' });
      left -= m;
    }
  }
  items.push({ id: uid(), topic: 'Wrap up: where we stopped and what\'s next', minutes: 7, kind: 'wrap', notes: '' });
  return items;
}

/* -------------------------------------------------------------- saving */
const bridge = window.__PLC || null;
let saveTimer = null;
function setStatus(s) {
  APP.status = s;
  const el = $('#saveStatus'); if (!el) return;
  el.className = 'status-dot ' + (s === 'saving' ? 'saving' : s === 'error' ? 'error' : '');
  el.querySelector('span').textContent = { saved: APP.mode === 'cloud' ? 'Saved online' : APP.demo ? 'Example team' : 'Saved in this browser', saving: 'Saving…', error: 'Not saved yet' }[s];
}
function save() {
  if (APP.mode === 'local') { store.set(localKey(), S); setStatus('saved'); return; }
  store.set('lp-pending:' + APP.wsId, S);
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCloud, 900);
}
const localKey = () => 'plc-launchpad-1:' + APP.teamKey;
async function api(method, path, body, headers = {}) {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...headers }, body: body == null ? undefined : JSON.stringify(body) });
  let data = {}; try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}
let saving = false, dirtyAgain = false;
async function saveCloud() {
  if (saving) { dirtyAgain = true; return; }
  saving = true;
  const snapshot = clone(S);
  try {
    const r = await api('PUT', '/api/demo/' + APP.wsId, { subject: APP.subject, catalogId: (S.team.catalogs || [])[0] || 'none', state: snapshot }, { 'If-Match': APP.etag });
    if (r.status === 409) { await resolveConflict(snapshot); return; }
    if (!r.ok) throw new Error(r.data.error || 'Save failed');
    APP.etag = r.data.etag;
    store.del('lp-pending:' + APP.wsId);
    setStatus('saved');
  } catch (e) {
    setStatus('error');
    toast((e && e.message) || 'Not saved yet. Launchpad will try again.');
    clearTimeout(saveTimer); saveTimer = setTimeout(saveCloud, 8000);
  } finally {
    saving = false;
    if (dirtyAgain) { dirtyAgain = false; saveCloud(); }
  }
}
/* Someone else saved first: keep a copy of ours in Version history, then load theirs. */
async function resolveConflict(mine) {
  await api('PUT', '/api/demo/' + APP.wsId + '?recovery=1', { subject: APP.subject, catalogId: (S.team.catalogs || [])[0] || 'none', state: mine });
  const r = await api('GET', '/api/demo/' + APP.wsId);
  if (r.ok && r.data.payload && !r.data.payload.fresh) { S = r.data.payload.state; APP.etag = r.data.etag; }
  store.del('lp-pending:' + APP.wsId);
  setStatus('saved');
  render();
  toast('A teammate saved at the same time. Their version is showing, and yours is kept in Version history.');
}

async function boot() {
  APP.catalogs = JSON.parse($('#catalogs').textContent);
  if (bridge) {
    if (bridge.ready) await bridge.ready;
    APP.mode = 'cloud';
    const params = bridge.params || {};
    APP.root = params.shared; APP.subject = params.course || 'engineering';
    try {
      const dir = await api('GET', '/api/directory/' + APP.root);
      if (dir.ok) APP.directory = dir.data;
      const look = await api('POST', '/api/demo/' + APP.root + '?course=' + encodeURIComponent(APP.subject));
      if (!look.ok) throw new Error(look.data.error || 'That team could not be opened.');
      APP.wsId = look.data.id;
      const got = await api('GET', '/api/demo/' + APP.wsId);
      if (!got.ok) throw new Error(got.data.error || 'That team could not be opened.');
      const team = APP.directory?.teams.find(t => (/^[0-9a-f-]{36}$/.test(t.id) ? 'team-' + t.id : t.id) === APP.subject);
      if (got.data.payload.fresh || got.data.payload.state?.schema !== 'launchpad-1') {
        S = blankState(team?.name || 'Our PLC team', '', team?.catalogs?.length ? team.catalogs : [APP.subject]);
        APP.etag = got.data.etag || '';
        if (!got.data.payload.fresh) APP.etag = got.data.etag; // older workspace: replaced on first save, kept in history
      } else { S = got.data.payload.state; APP.etag = got.data.etag; }
      const pending = store.get('lp-pending:' + APP.wsId);
      if (pending && pending.schema === 'launchpad-1' && JSON.stringify(pending) !== JSON.stringify(S)) { S = pending; save(); toast('Your unsaved changes from last time were restored.'); }
      const email = (bridge.email || '').toLowerCase();
      ME = S.members.find(m => (m.email || '').toLowerCase() === email)?.id || store.get('lp-me:' + APP.wsId);
    } catch (e) {
      document.body.innerHTML = `<main><div class="card" style="max-width:560px;margin:60px auto"><h2>This team couldn't be opened</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="plcReload()">Try again</button></div></main>`;
      return false;
    }
  } else {
    APP.mode = 'local';
    APP.teamKey = store.get('lp-current-team') || 'demo';
    S = store.get(localKey());
    if (!S || S.schema !== 'launchpad-1') { S = APP.teamKey === 'demo' ? sampleState() : blankState(); store.set(localKey(), S); }
    APP.demo = APP.teamKey === 'demo';
    ME = store.get('lp-me:' + APP.teamKey) || (APP.demo ? 'm1' : null);
  }
  return true;
}
function setMe(id) {
  ME = id;
  store.set('lp-me:' + (APP.mode === 'cloud' ? APP.wsId : APP.teamKey), id);
}

/* ---------- binding: inputs with data-bind write straight into the workspace ---------- */
function scopeObj(scope) {
  const r = route();
  if (scope === 'p') return planById(r.a);
  if (scope === 'm') return S.meetings.find(m => m.id === r.a);
  return S;
}
function walk(obj, path) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    o = k.startsWith('#') ? o.find(x => x.id === k.slice(1)) : (o[k] ??= {});
    if (o == null) return [null];
  }
  return [o, parts[parts.length - 1]];
}
function setPath(obj, path, val) { const [o, k] = walk(obj, path); if (o) o[k] = val; }
function getPath(obj, path) { const [o, k] = walk(obj, path); return o ? o[k] : undefined; }

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) {
    const [scope, path] = el.dataset.bind.split(':');
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.type === 'number') v = v === '' ? '' : Number(v);
    setPath(scopeObj(scope), path, v);
    save();
    if (el.dataset.live) refreshLive(el.dataset.live, el);
  }
  if (el.matches('[data-filter]')) refreshLive(el.dataset.filter, el);
});
document.addEventListener('change', e => { if (e.target.matches('[data-bind][data-rerender]')) render(); });

function orbitSVG(p) {
  const pos = { learn: [125, 125], check: [395, 125], reteach: [395, 395], stretch: [125, 395] };
  const C = 2 * Math.PI * 70;
  const planets = Object.entries(FAMILIES).map(([f, info]) => {
    const [x, y] = pos[f], v = famProgress(p, f);
    const first = STEPS.find(s => s.fam === f && stepState(p, s.key) < 100) || STEPS.find(s => s.fam === f);
    const label = `Question ${info.n}, ${info.word}: ${info.q} ${v}% done. Open ${first.label}.`;
    return `<a href="#plan-${p.id}-${first.key}" class="planet" aria-label="${esc(label)}"><g class="face">
      <circle class="track" cx="${x}" cy="${y}" r="70" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle cx="${x}" cy="${y}" r="70" fill="none" stroke="var(--${f})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v / 100)}" transform="rotate(-90 ${x} ${y})"/>
      <circle cx="${x}" cy="${y}" r="58" fill="var(--paper)" stroke="var(--${f})" stroke-width="3"/>
      <svg x="${x - 15}" y="${y - 40}" width="30" height="30" viewBox="0 0 24 24" class="ico" style="color:var(--${f})">${ICONS[f]}</svg>
      <text x="${x}" y="${y + 10}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--ink)">${info.word}</text>
      <text x="${x}" y="${y + 30}" text-anchor="middle" font-size="13" fill="var(--ink-soft)" style="font-family:var(--body)">${v >= 100 ? 'Done' : v > 0 ? v + '% done' : 'Not started'}</text>
      <circle cx="${x + 50}" cy="${y - 46}" r="15" fill="var(--${f})"/>
      <text x="${x + 50}" y="${y - 41}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--on-${f})">${info.n}</text></g></a>`;
  }).join('');
  const t = planTitle(p), lines = wrapText(t, 16, 3);
  return `<svg class="orbit" viewBox="0 0 520 520" role="group" aria-label="This plan's four questions">
    <circle class="ring" cx="260" cy="260" r="191"/>
    <g class="moon"><circle cx="260" cy="69" r="8" fill="var(--team)"/><animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="40s" repeatCount="indefinite"/></g>
    <circle cx="260" cy="260" r="84" fill="var(--ink)"/>
    <text x="260" y="${236 - (lines.length - 1) * 9}" text-anchor="middle" font-size="12" fill="var(--sky)" opacity=".7" style="font-family:var(--body);letter-spacing:.1em">THIS PLAN</text>
    ${lines.map((l, i) => `<text x="260" y="${262 - (lines.length - 1) * 9 + i * 20}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--sky)">${esc(l)}</text>`).join('')}
    ${planets}</svg>`;
}
function wrapText(text, width, maxLines) {
  const words = String(text).replace(/^I can /i, 'I can ').split(/\s+/), lines = [];
  let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > width && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
    if (lines.length === maxLines) break;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (lines.length === maxLines && words.join(' ').length > lines.join(' ').length) lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…';
  return lines;
}

/* PLC Launchpad 1.0 · the plan flight path and its eleven steps */

/* One step at a time: a slim progress strip, one question, one main button. */
function viewPlan(r) {
  const p = planById(r.a);
  if (!p) return `<div class="empty">${icon('plan')}<b>That plan isn't here anymore.</b><a class="btn" href="#home">Back to home</a></div>`;
  if (S.activePlanId !== p.id) { S.activePlanId = p.id; save(); }
  const st = step(r.b) || nextStep(p);
  const idx = STEPS.indexOf(st), prev = STEPS[idx - 1], next = STEPS[idx + 1], fam = FAMILIES[st.fam];
  const done = stepState(p, st.key) === 100;
  const talk = p.talk[st.key] || [];
  const meeting = runningMeeting();
  const dots = STEPS.map((s, i) => {
    const v = stepState(p, s.key), gap = i > 0 && STEPS[i - 1].fam !== s.fam ? '<i></i>' : '';
    return `${gap}<a class="f-${s.fam} ${v === 100 ? 'on' : v > 0 ? 'half' : ''} ${s.key === st.key ? 'cur' : ''}" href="#plan-${p.id}-${s.key}" title="Step ${i + 1}: ${esc(s.label)}" aria-label="Step ${i + 1}: ${esc(s.label)}${v === 100 ? ', done' : ''}"></a>`;
  }).join('');
  const body = (STEP_VIEWS[st.key] || (() => ''))(p);
  return `<div class="focus">
    <div class="strip">
      <a class="btn sm ghost" href="#home">${icon('back')}Home</a>
      <div class="strip-mid"><span class="small"><b>Step ${idx + 1} of ${STEPS.length}</b> · ${esc(planTitle(p))}</span><div class="dots" aria-label="Plan steps">${dots}</div></div>
      <button class="btn sm ghost" data-act="allSteps">${icon('norms')}All steps</button>
    </div>
    <section class="card station tint f-${st.fam}" aria-labelledby="stepTitle">
      <div class="st-head"><span class="orb lg">${icon(st.icon)}</span><div class="grow">
        <span class="eyebrow fam-text">Question ${fam.n} · ${fam.word} · ${esc(fam.q)}</span>
        <h1 class="step-q" id="stepTitle">${esc(st.q)}</h1><p class="what">${esc(st.what)}</p>
        <div class="row" style="align-items:flex-start">${termChip(st.term, st.fam)}<button type="button" class="btn sm ghost" data-act="say" data-text="${esc(st.q + ' ' + st.what)}">${icon('listen')}Read this to me</button></div>
      </div></div>
      <div class="st-body">${body}</div>
      <details class="talk-box f-team" ${talk.length ? '' : ''}><summary><span class="orb sm">${icon('note')}</span>Team notes for this step${talk.length ? ` (${talk.length})` : ''}${meeting ? ' · saved to today\'s meeting too' : ''}</summary>
        <div class="list">${talk.map(n => `<div class="li" style="border-radius:22px"><span class="avatar">${esc(initials(memberName(n.by)))}</span><span><b style="font-weight:400">${esc(n.text)}</b><span class="sub">${esc(memberName(n.by))} · ${esc(fmtDate(n.at))}</span></span><button class="icon-btn" aria-label="Delete note" data-act="delTalk" data-id="${n.id}">${icon('trash')}</button></div>`).join('')}</div>
        <div class="row"><input type="text" id="talkInput" placeholder="What did the team say or decide?" style="flex:1;min-width:200px"><button class="btn sm" data-act="addTalk">${icon('plus')}Add note</button></div>
      </details>
      <div class="st-foot">
        ${prev ? `<a class="btn ghost" href="#plan-${p.id}-${prev.key}">${icon('back')}Back</a>` : ''}
        <span class="spacer"></span>
        <a class="link-quiet" href="#home">Finish later</a>
        <button class="btn big" data-act="saveNext" data-step="${st.key}">${next ? (done ? 'Next step' : 'Save and continue') : (done ? 'Back to home' : 'Finish this plan')}${icon('arrow')}</button>
      </div>
      ${done ? `<p class="small muted done-note">${icon('done')}This step is done. <button type="button" class="linkish" data-act="undoStep" data-step="${st.key}">Mark it not done</button></p>` : ''}
    </section></div>`;
}
ACT.saveNext = b => {
  const p = planById(route().a), key = b.dataset.step;
  if (!p.steps[key]?.done) p.steps[key] = { ...(p.steps[key] || {}), done: true, at: new Date().toISOString() };
  save();
  const next = STEPS[STEPS.indexOf(step(key)) + 1];
  if (next) { toast('Saved. Step ' + (STEPS.indexOf(next) + 1) + ': ' + next.label); go(`plan-${p.id}-${next.key}`); }
  else { toast('Plan finished. Well done!'); go('home'); }
};
ACT.undoStep = b => { const p = planById(route().a); p.steps[b.dataset.step] = { done: false }; save(); render(); };
ACT.allSteps = () => {
  const p = planById(route().a), cur = step(route().b) || nextStep(p);
  let html = '';
  for (const [f, info] of Object.entries(FAMILIES)) {
    html += `<div class="fam-label f-${f}">${icon(f)}Question ${info.n} · ${info.word}</div>`;
    for (const s of STEPS.filter(s => s.fam === f)) html += `<a class="step-link f-${f}" href="#plan-${p.id}-${s.key}" data-close ${s.key === cur.key ? 'aria-current="step"' : ''}>${tokHTML(stepState(p, s.key), s.icon)}<span>${STEPS.indexOf(s) + 1}. ${esc(s.label)}</span></a>`;
  }
  ask(`<div class="row"><h2 class="spacer">All steps</h2><button type="button" class="icon-btn" data-cancel aria-label="Close">${icon('close')}</button></div><div class="steps-dialog">${html}</div>`,
    { onOpen: d => $$('[data-close]', d).forEach(a => a.addEventListener('click', () => d.close())) });
};
ACT.addTalk = () => {
  const input = $('#talkInput'), text = input.value.trim(); if (!text) { input.focus(); return; }
  const r = route(), p = planById(r.a), key = (step(r.b) || nextStep(p)).key;
  const note = { id: uid(), at: todayISO(), by: ME || '', text };
  (p.talk[key] ||= []).push(note);
  const m = runningMeeting();
  if (m) (m.stepNotes ||= []).push({ ...note, planId: p.id, stepKey: key });
  save(); render();
};
ACT.delTalk = b => { const r = route(), p = planById(r.a), key = (step(r.b) || nextStep(p)).key; p.talk[key] = (p.talk[key] || []).filter(n => n.id !== b.dataset.id); save(); render(); };

    ${chosen.length ? chosen.map(s => `<div class="chosen"><span class="orb f-learn">${icon('standard')}</span><div class="stack" style="gap:4px"><span class="eyebrow" style="color:var(--learn)">Our must-learn skill · ${esc(s.code)}</span><b>${esc(s.text)}</b><span class="small muted">${esc(s.pathway || s.catalogTitle || '')}</span></div><button class="icon-btn" data-act="toggleStd" data-id="${s.id}" aria-label="Remove">${icon('close')}</button></div>`).join('') : ''}
    ${chosen.length ? `<div class="field f-learn"><span class="lbl">Why this skill made the cut</span><span class="help">Tap all that are true. PLC words: readiness, leverage, endurance.</span>
      <div class="chips">${why.map(([w, t]) => `<button type="button" class="chip" aria-pressed="${p.why.includes(w)}" data-act="toggleWhy" data-v="${esc(w)}">${esc(w)}${t ? ` <small>· ${t}</small>` : ''}</button>`).join('')}</div></div>` : ''}
    ${chosen.length && !APP.pickSkill ? `<div><button type="button" class="linkish" data-act="pickSkill">Choose a different skill</button></div>` : `<div class="field f-learn"><label for="stdSearch">Find the skill in your state standards</label>
      <div class="std-tools"><input type="search" id="stdSearch" placeholder="Search by word or code, like sketch or B2" data-filter="std"></div>
      <div class="std-list" id="stdList">${stdListHTML(p, '')}</div></div>`}`;
};
function stdListHTML(p, q) {
  const all = catalogStandards();
  if (!all.length) return `<div class="empty">No standards are set for this team. Choose them on the Team page.</div>`;
  const ql = q.trim().toLowerCase();
  const match = s => !ql || (s.code + ' ' + s.text + ' ' + (s.pathway || '')).toLowerCase().includes(ql);
  const out = [];
  for (const s of all) {
    const broad = isBroad(s);
    const kids = broad ? all.filter(k => !isBroad(k) && parentCode(k) === s.code && k.catalog === s.catalog) : [];
    if (!broad && all.some(b => isBroad(b) && b.code === parentCode(s) && b.catalog === s.catalog)) continue; // listed under its parent
    if (!match(s) && !kids.some(match)) continue;
    out.push(stdBtn(p, s, broad ? 'Big standard' : 'Skill'));
    for (const k of kids) if (match(k) || match(s)) out.push(stdBtn(p, k, 'One skill inside it', true));
  }
  return out.join('') || `<div class="empty">Nothing matches "${esc(q)}". Try a shorter word.</div>`;
}
const stdBtn = (p, s, kind, child) => `<button type="button" class="std ${isBroad(s) ? 'broad' : ''} ${child ? 'child' : ''}" aria-pressed="${p.standardIds.includes(s.id)}" data-act="toggleStd" data-id="${s.id}"><span class="code">${esc(s.code)}</span><span><span class="kind">${kind}</span>${esc(s.text)}</span></button>`;
LIVE.std = el => { const p = planById(route().a); $('#stdList').innerHTML = stdListHTML(p, el.value); };
ACT.toggleStd = b => {
  const p = planById(route().a), id = b.dataset.id;
  p.standardIds = p.standardIds.includes(id) ? p.standardIds.filter(x => x !== id) : [id];
  APP.pickSkill = false;
  save(); render(); if (p.standardIds.length) toast('Skill chosen. When you\'re ready, press Save and continue.');
};
ACT.pickSkill = () => { APP.pickSkill = true; render(); setTimeout(() => $('#stdSearch')?.focus(), 30); };
ACT.toggleWhy = b => { const p = planById(route().a), v = b.dataset.v; p.why = p.why.includes(v) ? p.why.filter(x => x !== v) : [...p.why, v]; save(); render(); };

/* -------------------------------------------------------------- 2 targets */
STEP_VIEWS.targets = p => {
  const s = p.standardIds.length && standardById(p.standardIds[0]);
  if (!p.targets.length) p.targets.push({ id: uid(), text: '' });
  return `${s ? `<div class="chosen"><span class="orb sm f-learn">${icon('standard')}</span><div><span class="eyebrow" style="color:var(--learn)">Official wording · ${esc(s.code)}</span><p>${esc(s.text)}</p></div></div>` : `<div class="empty">Choose the skill first. <a class="btn sm" href="#plan-${p.id}-skill">Choose the skill</a></div>`}
    ${zava('Start with "I can". Use words a student would use, and name something you could see them do on a short check. Each statement gets a letter that follows it through the whole plan.',
      '<b>Official:</b> "Demonstrate the sketching process used in concept development."<br><b>A:</b> I can sketch the front, top and side views of a simple object.<br><b>B:</b> I can line up the views so their sizes match.')}
    <div class="stack" id="targetRows">${p.targets.map((t, i) => `<div class="target-row f-learn"><span class="letter">${LETTERS[i]}</span>
      <textarea id="t-${t.id}" data-bind="p:targets.#${t.id}.text" placeholder="I can…" aria-label="I can statement ${LETTERS[i]}" style="min-height:60px">${esc(t.text)}</textarea>
      <button class="icon-btn" data-act="delTarget" data-id="${t.id}" aria-label="Remove statement ${LETTERS[i]}">${icon('trash')}</button></div>`).join('')}</div>
    <div class="row">${p.targets.length < 4 ? `<button class="btn sm ghost" data-act="addTarget">${icon('plus')}Add another "I can"</button>` : ''}
      ${APP.mode === 'cloud' ? `<button class="btn sm fam f-learn" data-act="suggestTargets">${icon('guide')}Suggest wording</button>` : ''}</div>
    <div id="suggestions"></div>`;
};
ACT.addTarget = () => { const p = planById(route().a); p.targets.push({ id: uid(), text: '' }); save(); render(); };
ACT.delTarget = b => { const p = planById(route().a); p.targets = p.targets.filter(t => t.id !== b.dataset.id); p.check.items.forEach(i => { if (i.targetId === b.dataset.id) i.targetId = ''; }); save(); render(); };
ACT.suggestTargets = async b => {
  const p = planById(route().a), box = $('#suggestions');
  b.disabled = true; box.innerHTML = `<p class="muted">Zava is writing two suggestions…</p>`;
  const r = await api('POST', '/api/learning-targets', { teamId: APP.root, subject: APP.subject, planId: p.id, standards: p.standardIds.map(standardById).filter(Boolean).map(s => ({ code: s.code, text: s.text })), draft: p.targets.map(t => t.text).filter(Boolean).join('\n') });
  b.disabled = false;
  if (!r.ok) { box.innerHTML = `<p class="muted">${esc(r.data.error || 'Suggestions are unavailable right now.')}</p>`; return; }
  box.innerHTML = `<div class="stack">${r.data.suggestions.map(sg => `<div class="li f-learn" style="border-radius:22px"><span class="orb sm">${icon('guide')}</span><span><b style="font-weight:400">${esc(sg)}</b></span><button class="btn sm" data-act="useSuggestion" data-text="${esc(sg)}">Use this</button></div>`).join('')}</div>`;
};
ACT.useSuggestion = b => { const p = planById(route().a); const empty = p.targets.find(t => !t.text.trim()); if (empty) empty.text = b.dataset.text; else p.targets.push({ id: uid(), text: b.dataset.text }); save(); render(); };

/* --------------------------------------------------------------- 3 got it */
STEP_VIEWS.gotit = p => {
  return `${zava('Decide this before anyone sees results, so the team sorts students the same way. Many teams use 75% or 80% of the points.', 'On an 8-point check with "got it" at 75%, a student needs 6 points.', 'learn')}
    <div class="fields f-learn">
      <div class="field"><label for="gotIt">"Got it" means at least this much of the points</label><div class="row"><input id="gotIt" type="number" min="1" max="100" step="5" style="width:110px" data-type="number" data-bind="p:gotIt" data-live="gotit" value="${esc(p.gotIt)}"><b>%</b></div></div>
      <div class="field"><span class="lbl">In points</span><p id="gotItPoints" class="goal-sentence" style="font-size:1.1rem;padding:12px 16px">${gotItPoints(p)}</p></div>
      <div class="field wide"><label for="gotNote">What does a student who has it do?</label><span class="help">Describe it so any teacher on the team would score the same work the same way.</span>
        <textarea id="gotNote" data-bind="p:gotItNote" placeholder="A student who has it…">${esc(p.gotItNote)}</textarea></div>
    </div>`;
};
const gotItPoints = p => { const m = maxPoints(p); return m ? `${Math.ceil((m * p.gotIt) / 100)} of ${m} points on the team check` : 'Set once the team check has points.'; };
LIVE.gotit = () => { const el = $('#gotItPoints'); if (el) el.textContent = gotItPoints(planById(route().a)); };

/* ------------------------------------------------------------ 4 the check */
STEP_VIEWS.build = p => {
  const opts = id => `<option value="">Which "I can"?</option>` + p.targets.map((t, i) => `<option value="${t.id}" ${t.id === id ? 'selected' : ''}>${LETTERS[i]} · ${esc(t.text.slice(0, 40) || 'statement ' + LETTERS[i])}</option>`).join('');
  return `${zava('Keep it short: four to six questions is plenty. Give it on the same day in every class if you can, and tie every question to an "I can" statement so results show which part students missed.', '', 'check')}
    <div class="fields f-check">
      <div class="field"><label for="ckName">Name of the check</label><input id="ckName" type="text" data-bind="p:check.name" value="${esc(p.check.name)}" placeholder="Three-view sketch check"></div>
      <div class="field"><label for="ckDate">Day every class takes it</label><input id="ckDate" type="date" data-bind="p:check.date" value="${esc(p.check.date)}"></div>
    </div>
    <div class="stack f-check" id="items">${p.check.items.map((it, i) => `<div class="item-row">
      <span class="n">${i + 1}</span>
      <textarea id="ip-${it.id}" data-bind="p:check.items.#${it.id}.prompt" aria-label="Question ${i + 1}" placeholder="Question or task">${esc(it.prompt)}</textarea>
      <input type="number" min="0" step="1" aria-label="Points for question ${i + 1}" data-type="number" data-bind="p:check.items.#${it.id}.points" data-live="points" value="${esc(it.points)}" placeholder="Points">
      <select aria-label="I can statement for question ${i + 1}" data-bind="p:check.items.#${it.id}.targetId">${opts(it.targetId)}</select>
      <button class="icon-btn" data-act="delItem" data-id="${it.id}" aria-label="Remove question ${i + 1}">${icon('trash')}</button>
      <textarea style="grid-column:2/-1;min-height:48px" data-bind="p:check.items.#${it.id}.guide" aria-label="Scoring guide for question ${i + 1}" placeholder="Scoring guide (teachers only): what earns each point">${esc(it.guide || '')}</textarea>
    </div>`).join('')}</div>
    <div class="row"><button class="btn sm fam f-check" data-act="addItem">${icon('plus')}Add a question</button><span class="spacer"></span><b id="totalPts">${maxPoints(p)} points in all</b></div>
    ${!p.targets.some(t => t.text) ? `<p class="small muted">Tip: write your "I can" statements first so each question can be tied to one.</p>` : ''}`;
};
ACT.addItem = () => { const p = planById(route().a); p.check.items.push({ id: uid(), prompt: '', points: 1, targetId: p.targets[0]?.id || '', guide: '' }); save(); render(); setTimeout(() => $$('#items textarea')[$$('#items textarea').length - 2]?.focus(), 30); };
ACT.delItem = b => { const p = planById(route().a); p.check.items = p.check.items.filter(i => i.id !== b.dataset.id); save(); render(); };
LIVE.points = () => { const el = $('#totalPts'); if (el) el.textContent = maxPoints(planById(route().a)) + ' points in all'; };

/* ------------------------------------------------------------ 5 team goal */
STEP_VIEWS.goal = p => `${zava('A good goal is a stretch but reachable. If you gave a pre-check, enter where students started so you can see growth.', 'By Dec 3, 80% of our students will reach "got it" on the three-view sketch check, up from 40%.', 'check')}
  <div class="fields f-check">
    <div class="field"><label for="gTarget">Share of students who will reach "got it"</label><div class="row"><input id="gTarget" type="number" min="1" max="100" step="5" style="width:110px" data-type="number" data-bind="p:goal.target" data-live="goal" value="${esc(p.goal.target)}"><b>%</b></div></div>
    <div class="field"><label for="gDate">By this date</label><input id="gDate" type="date" data-bind="p:goal.date" data-live="goal" value="${esc(p.goal.date)}"></div>
    <div class="field"><label for="gBase">Where students started (optional)</label><span class="help">PLC word: baseline</span><div class="row"><input id="gBase" type="number" min="0" max="100" style="width:110px" data-type="number" data-bind="p:goal.baseline" data-live="goal" value="${esc(p.goal.baseline)}"><b>%</b></div></div>
  </div>
  <div class="field"><span class="lbl">Our team goal</span><p class="goal-sentence" id="goalSentence">${goalSentence(p)}</p></div>`;
function goalSentence(p) {
  const d = p.goal.date ? fmtDate(p.goal.date, { month: 'long', day: 'numeric' }) : '<mark>a date</mark>';
  return `By ${p.goal.date ? `<mark>${esc(d)}</mark>` : d}, <mark>${esc(p.goal.target || '?')}%</mark> of our students will reach "got it" on ${p.check.name ? `the <mark>${esc(p.check.name)}</mark>` : 'our team check'}${p.goal.baseline !== '' && p.goal.baseline != null ? `, up from <mark>${esc(p.goal.baseline)}%</mark>` : ''}.`;
}
LIVE.goal = () => { const el = $('#goalSentence'); if (el) el.innerHTML = goalSentence(planById(route().a)); };

/* --------------------------------------------------------------- 6 scores */
STEP_VIEWS.scores = p => scoresView(p, 'first');
function scoresView(p, kind) {
  if (!p.check.items.length) return `<div class="empty">${icon('check')}<b>Build the team check first</b><span>Scores are entered for each question on the check.</span><a class="btn fam f-check" href="#plan-${p.id}-build">Build the team check</a></div>`;
  const me = member(ME);
  const entry = S.members.map(m => { const st = stats(p, { kind, teacherId: m.id }); return `<span class="tdot ${st.n ? 'in' : ''}"><i>${esc(initials(m.name))}</i>${esc(m.name)} · ${st.n ? plural(st.n, 'student') : 'not yet'}</span>`; }).join('');
  if (!me) return `<div class="teacher-dots">${entry}</div><div class="empty">${icon('person')}<b>Which teacher are you?</b><span>You enter scores for your own classes only.</span><button class="btn" data-act="whoAmI">Choose your name</button></div>`;
  const sets = p.scores.filter(s => s.teacherId === ME && (s.kind || 'first') === kind);
  const intro = kind === 'recheck'
    ? zava('Re-check only the students who didn\'t reach "got it" the first time. Launchpad adds them for you.', '', 'reteach')
    : zava('Enter a score for each question. A total and "got it" fill in on their own. You can paste straight from a spreadsheet: student ID first, then one column per question.', '', 'check');
  return `${intro}
    <div class="row"><span class="small muted">Who has entered:</span><div class="teacher-dots">${entry}</div></div>
    ${privacyNote('Use student ID numbers, not names. Your teammates never see your students\' rows, only team totals.')}
    ${sets.map(set => scoreTable(p, set)).join('') || `<div class="empty">No classes yet.</div>`}
    <div class="row"><button class="btn fam ${kind === 'recheck' ? 'f-reteach' : 'f-check'}" data-act="addSet" data-kind="${kind}">${icon('plus')}${kind === 'recheck' ? 'Start my re-check list' : sets.length ? 'Add another class' : 'Add my first class'}</button></div>`;
}
function scoreTable(p, set) {
  const items = p.check.items;
  return `<div class="stack"><div class="row"><span class="orb sm f-check">${icon('score')}</span><input type="text" aria-label="Class name" data-bind="p:scores.#${set.id}.period" value="${esc(set.period)}" style="max-width:220px" placeholder="Class period">
    <span class="spacer"></span><button class="btn sm ghost" data-act="pasteRows" data-set="${set.id}">${icon('paste')}Paste from a spreadsheet</button><button class="btn sm danger" data-act="delSet" data-set="${set.id}">${icon('trash')}Remove class</button></div>
    <div class="score-wrap"><table class="scores"><thead><tr><th scope="col">Student ID</th>${items.map((it, i) => `<th scope="col" title="${esc(it.prompt)}">Q${i + 1}<br><span class="muted">/${esc(it.points)}${it.targetId ? ' · ' + LETTERS[p.targets.findIndex(t => t.id === it.targetId)] : ''}</span></th>`).join('')}<th scope="col">Total</th><th scope="col">Result</th><th></th></tr></thead>
    <tbody>${set.rows.map(row => scoreRow(p, set, row)).join('')}</tbody></table></div>
    <div><button class="btn sm soft" data-act="addRow" data-set="${set.id}">${icon('plus')}Add a student</button></div></div>`;
}
function scoreRow(p, set, row) {
  const res = rowResult(p, row);
  return `<tr id="row-${row.id}"><td><input class="sid" type="text" aria-label="Student ID" data-bind="p:scores.#${set.id}.rows.#${row.id}.student" value="${esc(row.student)}"></td>
    ${p.check.items.map((it, i) => `<td><input type="number" min="0" max="${esc(it.points)}" aria-label="Student ${esc(row.student)} question ${i + 1}" data-type="number" data-bind="p:scores.#${set.id}.rows.#${row.id}.s.${it.id}" data-live="row" data-row="${row.id}" data-set="${set.id}" value="${esc(row.s?.[it.id] ?? '')}"></td>`).join('')}
    <td class="num" data-total>${res.complete ? `${res.total}/${res.max}` : '–'}</td><td data-got>${gotPill(res)}</td>
    <td><button class="icon-btn" data-act="delRow" data-set="${set.id}" data-row="${row.id}" aria-label="Remove student">${icon('close')}</button></td></tr>`;
}
const gotPill = res => res.complete ? (res.got ? `<span class="got yes">${icon('done')}Got it</span>` : `<span class="got no">Not yet</span>`) : `<span class="got wait">Not scored yet</span>`;
LIVE.row = el => {
  const p = planById(route().a), set = p.scores.find(s => s.id === el.dataset.set), row = set.rows.find(r => r.id === el.dataset.row);
  const res = rowResult(p, row), tr = $('#row-' + row.id);
  $('[data-total]', tr).textContent = res.complete ? `${res.total}/${res.max}` : '–';
  $('[data-got]', tr).innerHTML = gotPill(res);
};
ACT.addSet = b => {
  const p = planById(route().a), kind = b.dataset.kind, me = member(ME);
  const set = { id: uid(), teacherId: ME, period: kind === 'recheck' ? 'Re-check' : (me?.periods ? 'Period ' + String(me.periods).split(/[,\s]+/)[p.scores.filter(s => s.teacherId === ME).length] || 'My class' : 'My class'), kind, rows: [] };
  if (kind === 'recheck') {
    for (const s of p.scores.filter(s => s.teacherId === ME && (s.kind || 'first') === 'first'))
      for (const r of s.rows) { const res = rowResult(p, r); if (res.complete && !res.got) set.rows.push({ id: uid(), student: r.student, s: {} }); }
    if (!set.rows.length) { toast('None of your students need a re-check.'); return; }
  } else set.rows.push({ id: uid(), student: '', s: {} });
  p.scores.push(set); save(); render();
};
ACT.delSet = async b => {
  const ok = await ask(`<h2>Remove this class?</h2><p class="muted">Its scores will be deleted. Version history keeps earlier saves.</p><div class="row end"><button type="button" class="btn ghost" data-cancel>Keep it</button><button class="btn danger">Remove class</button></div>`);
  if (!ok) return; const p = planById(route().a); p.scores = p.scores.filter(s => s.id !== b.dataset.set); save(); render();
};
ACT.addRow = b => { const p = planById(route().a), set = p.scores.find(s => s.id === b.dataset.set); const row = { id: uid(), student: '', s: {} }; set.rows.push(row); save(); render(); setTimeout(() => $(`#row-${row.id} .sid`)?.focus(), 30); };
ACT.delRow = b => { const p = planById(route().a), set = p.scores.find(s => s.id === b.dataset.set); set.rows = set.rows.filter(r => r.id !== b.dataset.row); save(); render(); };
ACT.pasteRows = async b => {
  const p = planById(route().a), set = p.scores.find(s => s.id === b.dataset.set);
  const fd = await ask(`<h2>Paste scores</h2><p class="muted">Copy rows from your spreadsheet: the student ID first, then one column for each of the ${p.check.items.length} questions, in order.</p>
    <textarea name="rows" rows="8" placeholder="1001&#9;2&#9;1&#9;2&#9;2" style="font-family:ui-monospace,monospace" required></textarea>
    <div class="row end"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn">Add these students</button></div>`);
  if (!fd) return;
  let added = 0;
  for (const line of String(fd.get('rows')).split(/\r?\n/)) {
    const cells = line.split(/\t|,/).map(c => c.trim()); if (!cells[0]) continue;
    const s = {}; p.check.items.forEach((it, i) => { const v = cells[i + 1]; if (v !== undefined && v !== '' && !isNaN(Number(v))) s[it.id] = Number(v); });
    set.rows = set.rows.filter(r => r.student || Object.keys(r.s).length);
    set.rows.push({ id: uid(), student: cells[0], s }); added++;
  }
  save(); render(); toast(`${plural(added, 'student')} added.`);
};

/* -------------------------------------------------------------- 7 results */
STEP_VIEWS.results = p => {
  const team = stats(p), mine = ME ? stats(p, { teacherId: ME }) : null;
  const inv = invitationsFor(ME).filter(i => i.plan.id === p.id);
  const discuss = [['Discuss', 'Which "I can" statement was hardest? What did we expect?'], ['Look at student work', 'Compare one strong and one missed answer. What is the error?'], ['Decide together', 'Who needs reteaching, and what will we do differently?']];
  return `${resultsPanel(p, team, mine)}
    ${inv.map(inviteCard).join('')}
    <div class="grid3">${discuss.map(([h, q], i) => `<div class="card bubble"><span class="eyebrow" style="color:var(--check)">${i + 1} · ${h}</span><p>${q}</p></div>`).join('')}</div>
    <div class="fields f-check"><div class="field wide"><label for="rNotes">What we noticed</label><textarea id="rNotes" data-bind="p:results.notes" placeholder="Most students drew the right views, but in the wrong places…">${esc(p.results.notes)}</textarea></div>
      <div class="field wide"><label for="rDec">What we decided</label><textarea id="rDec" data-bind="p:results.decision" placeholder="Reteach target B in small groups on Tuesday…">${esc(p.results.decision)}</textarea></div></div>`;
};
function resultsPanel(p, team, mine, compact) {
  if (!p.check.items.length || !team.n) return `<div class="locked">${icon('results')}<div><b>No scores yet</b><p class="small muted">Results appear once teachers enter scores.</p></div></div>`;
  if (!teamUnlocked(team)) return `<div class="locked">${icon('lock')}<div><b>Team results are hidden for now</b><p class="small muted">To protect privacy, they appear once at least ${PRIVACY_MIN_STUDENTS} students from ${PRIVACY_MIN_TEACHERS} teachers are scored. So far: ${plural(team.n, 'student')} from ${plural(team.teachers, 'teacher')}.</p></div></div>
    ${mine && mine.n ? myLine(mine) : ''}`;
  const R = 74, C = 2 * Math.PI * R, goal = Number(p.goal.target) || 0;
  const ring = `<div class="big-ring f-check"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--wash)" stroke-width="14"/>
    <circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--check)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - team.pct / 100)}" transform="rotate(-90 85 85)"/>
    ${goal ? `<line x1="85" y1="4" x2="85" y2="22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" transform="rotate(${goal * 3.6} 85 85)"/>` : ''}</svg>
    <b class="num">${team.pct}%</b><span>got it</span></div>`;
  const bars = p.targets.map((t, i) => { const s = team.per[t.id]; if (!s || !s.n) return ''; return `<div class="barrow f-learn"><span class="letter sm">${LETTERS[i]}</span>
    <div class="track"><i style="width:${s.pct}%;background:var(--check)"></i>${goal ? `<span class="goal" style="left:${goal}%" title="Team goal ${goal}%"></span>` : ''}</div><b class="num">${s.pct}%</b>
    <span class="lab">${esc(t.text)}</span></div>`; }).join('');
  return `<div class="card f-check" style="background:var(--paper)"><div class="row" style="align-items:center;gap:26px">${ring}
      <div class="stack" style="flex:1;min-width:240px"><div><span class="eyebrow">Whole team · ${plural(team.n, 'student')} · ${plural(team.teachers, 'teacher')}</span>
      <h3 style="margin-top:4px">${team.got} of ${team.n} students got it${goal ? ` · goal ${goal}%` : ''}</h3>${team.waiting ? `<p class="small muted">${plural(team.waiting, 'row')} not scored yet are left out.</p>` : ''}</div>
      ${compact ? '' : `<div class="bars">${bars}</div>`}</div></div>
    ${mine && mine.n ? myLine(mine, team) : ''}</div>`;
}
function myLine(mine, team) {
  return `<div class="li" style="border-radius:22px;background:var(--wash)"><span class="orb sm f-tool">${icon('lock')}</span><span><b>Your students: ${mine.pct}% got it${team ? ` · team ${team.pct}%` : ''}</b><span class="sub">Only you see this line.</span></span><span></span></div>`;
}

/* -------------------------------------------------------------- 8 reteach */
STEP_VIEWS.reteach = p => {
  const team = stats(p);
  const groups = p.targets.map((t, i) => { const s = team.per[t.id]; return s && s.n ? `<div class="li f-reteach" style="border-radius:22px"><span class="letter sm" style="background:var(--reteach);color:var(--on-reteach)">${LETTERS[i]}</span><span><b>${s.n - s.got} students need reteaching</b><span class="sub">${esc(t.text)}</span></span><span></span></div>` : ''; }).join('');
  const myKids = ME ? p.scores.filter(s => s.teacherId === ME && (s.kind || 'first') === 'first').flatMap(s => s.rows).filter(r => { const x = rowResult(p, r); return x.complete && !x.got; }).map(r => r.student) : [];
  const ideas = S.strategies.filter(s => s.planId === p.id || p.targets.some(t => t.id === s.targetId)).concat(S.strategies.filter(s => s.planId !== p.id)).slice(0, 3);
  return `${zava('Teaching it again the same way rarely works. Try a hands-on model, a visual, or a small group with a different teacher. Your teammates\' shared ideas are below.', '', 'reteach')}
    ${teamUnlocked(team) ? `<div class="stack">${groups}</div>` : `<div class="locked">${icon('lock')}<div><b>Group sizes appear with team results</b><p class="small muted">Once ${PRIVACY_MIN_STUDENTS} students from ${PRIVACY_MIN_TEACHERS} teachers are scored.</p></div></div>`}
    ${myKids.length ? `<div class="li" style="border-radius:22px"><span class="orb sm f-tool">${icon('lock')}</span><span><b>Your students for reteaching: ${myKids.map(esc).join(', ')}</b><span class="sub">Only you see these IDs.</span></span><span></span></div>` : ''}
    <div class="fields f-reteach">
      <div class="field"><label for="rtLead">Who leads the reteach group?</label><select id="rtLead" data-bind="p:reteach.leader"><option value="">Choose…</option>${S.members.map(m => `<option value="${m.id}" ${p.reteach.leader === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}<option value="each" ${p.reteach.leader === 'each' ? 'selected' : ''}>Each teacher with their own students</option></select></div>

STEP_VIEWS.stretch = p => {

/* ----------------------------------------------------------------- 11 wrap */
function finalStats(p) {
  const team = stats(p); if (!team.n) return team;
  const re = p.scores.filter(s => s.kind === 'recheck');
  let got = team.got;
  for (const set of re) for (const r of set.rows) {
    const res = rowResult(p, r); if (!res.complete || !res.got) continue;
    const first = p.scores.filter(s => s.teacherId === set.teacherId && (s.kind || 'first') === 'first').flatMap(s => s.rows).find(x => x.student === r.student);
    if (first && !rowResult(p, first).got) got++;
  }
  return { ...team, got, pct: pct(got, team.n) };
}
STEP_VIEWS.wrap = p => {
  const f = finalStats(p), goal = Number(p.goal.target) || 0;
  const met = teamUnlocked(f) && goal && f.pct >= goal;
  return `<div class="card f-stretch" style="background:var(--paper)">
      ${teamUnlocked(f) ? `<span class="eyebrow">After reteaching</span><h3 style="font-size:1.6rem">${f.pct}% of students have it${goal ? ` · goal ${goal}%` : ''}</h3>

    </div>
    ${zava('Take five minutes to name what worked. Then decide whether to keep going with this skill or start the next one.', '', 'stretch')}

  const who = s.anonymous ? 'A teammate' : memberName(s.teacherId);
  return `<article class="strat f-reteach"><div class="who"><span class="avatar">${s.anonymous ? icon('person') : esc(initials(who))}</span><span><b style="color:var(--ink)">${esc(who)}</b> shared ${esc(fmtDate(s.sharedAt))}</span></div>
    <blockquote>${esc(s.text)}</blockquote>
    <div class="row">${s.mine != null ? `<span class="proof">${icon('results')}${s.mine}% got it · team ${s.team}%</span>` : ''}${(s.tags || []).map(x => `<span class="chip" style="font-size:.78rem;padding:3px 10px">${esc(x)}</span>`).join('')}</div>
    ${t ? `<p class="small muted">For: ${esc(t.text)}</p>` : ''}${s.link ? `<a class="small" href="${esc(s.link)}" target="_blank" rel="noopener">${icon('link')} Materials</a>` : ''}
    ${s.teacherId === ME ? `<div><button class="btn sm ghost" data-act="unshare" data-id="${s.id}">Stop sharing</button></div>` : ''}</article>`;
}
function viewWorked() {
  const invites = invitationsFor(ME);
  const byPlan = S.plans.map(p => [p, S.strategies.filter(s => s.planId === p.id)]).filter(([, l]) => l.length);
  return `<div class="page-head"><div class="lead"><span class="eyebrow">What worked for us</span><h1>Teaching moves our team shares</h1>
    <p>When a teacher's students do better than the team on a skill, Launchpad invites them to share what they did. Sharing is always a choice, and you decide whether your name shows.</p></div>${termChip('Shared instructional practice', 'reteach')}</div>
    ${invites.length ? `<div class="stack" style="margin-bottom:26px">${invites.map(inviteCard).join('')}</div>` : ''}
    ${byPlan.length ? byPlan.map(([p, list]) => `<div class="stack" style="margin-bottom:26px"><div class="row"><span class="orb sm f-learn">${icon('plan')}</span><h3>${esc(planTitle(p))}</h3></div><div class="grid2">${list.map(stratCard).join('')}</div></div>`).join('')
      : `<div class="empty">${icon('practice')}<b>Nothing shared yet</b><span>Invitations appear after team results come in.</span></div>`}`;
}
const inviteByKey = key => invitationsFor(ME).find(i => i.key === key);
ACT.inviteLater = b => { ((S.invites[ME] ||= {}))[b.dataset.key] = 'later:' + addDays(todayISO(), 7); save(); render(); toast('We\'ll ask again next week.'); };
ACT.inviteNever = b => { ((S.invites[ME] ||= {}))[b.dataset.key] = 'never'; save(); render(); toast('Got it. We won\'t ask about this skill again.'); };
ACT.share = async b => {
  const inv = inviteByKey(b.dataset.key); if (!inv) return;
  const tags = ['Hands-on', 'Visual', 'Small groups', 'Partner check', 'Explained it differently', 'Real-world example', 'Technology', 'More practice time'];
  const fd = await ask(`<h2>Share what you did</h2><p class="muted">For "${esc(inv.target.text)}" · your students ${inv.mine}%, team ${inv.team}%</p>
    <div class="field"><label for="shText">What did you do that you think made the difference?</label><textarea id="shText" name="text" required placeholder="I had students hold a real block and trace each face before drawing…"></textarea></div>
    <div class="field"><span class="lbl">Tags (optional)</span><div class="chips">${tags.map(t => `<label class="chip"><input type="checkbox" name="tags" value="${esc(t)}"> ${esc(t)}</label>`).join('')}</div></div>
    <div class="field"><label for="shLink">Link to materials (optional)</label><input id="shLink" name="link" type="url" placeholder="https://"></div>
    <div class="field"><span class="lbl">Show my name?</span><div class="chips"><label class="chip"><input type="radio" name="anon" value="no" checked> Yes, show my name</label><label class="chip"><input type="radio" name="anon" value="yes"> Share as "a teammate"</label></div></div>
    <div class="row end"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn fam f-reteach">${icon('share')}Share with my team</button></div>`);
  if (!fd) return;
  S.strategies.push({ id: uid(), planId: inv.plan.id, targetId: inv.target.id, teacherId: ME, anonymous: fd.get('anon') === 'yes', text: String(fd.get('text')).trim(),
    tags: fd.getAll('tags').map(String), link: String(fd.get('link') || '').trim(), mine: inv.mine, team: inv.team, sharedAt: todayISO() });
  save(); render(); toast('Thank you. Your idea now shows in What worked for us.');
};
ACT.unshare = async b => {
  if (!await ask(`<h2>Stop sharing this?</h2><p class="muted">It will be removed for your whole team.</p><div class="row end"><button type="button" class="btn ghost" data-cancel>Keep sharing</button><button class="btn danger">Stop sharing</button></div>`)) return;
  S.strategies = S.strategies.filter(s => s.id !== b.dataset.id); save(); render();
};

/* ================================================================ TEAM */
function viewTeam() {
  const roles = ['Teacher', 'Team lead', 'Coach', 'Administrator'];
  const cats = Object.entries(APP.catalogs);
  return `<div class="page-head"><div class="lead"><span class="eyebrow">Team</span><h1>Our team</h1><p>Who's on the team, how you work together, and which standards you use.</p></div>
    <a class="btn ghost" href="#words">${icon('glossary')}PLC words</a></div>
    <div class="grid2" style="align-items:start">
      <div class="stack">
        <div class="card f-team"><div class="card-head"><span class="orb sm">${icon('team')}</span><h3 class="grow">Team details</h3></div>
          <div class="fields"><div class="field"><label for="tName">Team name</label><input id="tName" type="text" data-bind="t:team.name" value="${esc(S.team.name)}"></div>
            <div class="field"><label for="tCourse">Course</label><input id="tCourse" type="text" data-bind="t:team.course" value="${esc(S.team.course)}"></div>
            <div class="field"><label for="tGrade">Grade or level</label><input id="tGrade" type="text" data-bind="t:team.grade" value="${esc(S.team.grade)}"></div></div></div>
        <div class="card f-team"><div class="row"><span class="orb sm">${icon('person')}</span><h3 class="spacer">Members</h3><button class="btn sm fam" data-act="addMember">${icon('plus')}Add a teacher</button></div>
          ${S.members.map(m => `<div class="stack" style="background:var(--wash);border-radius:24px;padding:12px 14px;gap:10px"><div class="row"><span class="avatar">${esc(initials(m.name))}</span><input type="text" aria-label="Name" data-bind="t:members.#${m.id}.name" value="${esc(m.name)}" placeholder="Name" style="flex:1;min-width:140px">${m.id === ME ? '<span class="chip" aria-pressed="true" style="--c:var(--team);--on:var(--on-team)">You</span>' : ''}<button class="icon-btn" data-act="delMember" data-id="${m.id}" aria-label="Remove ${esc(m.name)}">${icon('trash')}</button></div>
            <div class="fields"><input type="email" aria-label="School email" data-bind="t:members.#${m.id}.email" value="${esc(m.email)}" placeholder="School email">
            <select aria-label="Role" data-bind="t:members.#${m.id}.role">${roles.map(r => `<option ${m.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
            <input type="text" class="wide" aria-label="Class periods" data-bind="t:members.#${m.id}.periods" value="${esc(m.periods || '')}" placeholder="Class periods, like 1, 3, 5"></div></div>`).join('') || '<p class="muted small">No one yet. Add each teacher on the team.</p>'}
          ${privacyNote('School emails let Launchpad know who\'s signed in on your school\'s Google site.')}
          ${S.members.length ? `<button class="btn sm soft" data-act="whoAmI">${icon('person')}${ME && member(ME) ? 'Change which teacher you are' : 'Which teacher are you?'}</button>` : ''}</div>
      </div>
      <div class="stack">
        <div class="card f-team"><div class="row"><span class="orb sm">${icon('norms')}</span><h3 class="spacer">Team agreements</h3><button class="btn sm fam" data-act="addNorm">${icon('plus')}Add</button></div>
          ${termChip('Norms', 'team')}
          ${S.norms.map((n, i) => `<div class="row"><span class="orb sm soft">${i + 1}</span><input type="text" aria-label="Agreement ${i + 1}" data-bind="t:norms.#${n.id}.text" value="${esc(n.text)}" style="flex:1"><button class="icon-btn" data-act="delNorm" data-id="${n.id}" aria-label="Remove agreement">${icon('trash')}</button></div>`).join('') || `<p class="muted small">Agreements like "We start and end on time" keep meetings on track.</p>`}</div>
        <div class="card f-learn"><div class="card-head"><span class="orb sm">${icon('standard')}</span><h3 class="grow">Standards we use</h3></div>
          ${APP.mode === 'cloud' ? `<p class="small muted">Set by your school's Launchpad admin in the directory.</p><ul class="small">${(S.team.catalogs || []).map(k => `<li>${esc(APP.catalogs[k]?.title || k)}</li>`).join('')}</ul>`
            : `<div class="chips">${cats.map(([k, c]) => `<button type="button" class="chip" aria-pressed="${(S.team.catalogs || []).includes(k)}" data-act="toggleCat" data-k="${k}">${esc(c.title || k)}</button>`).join('')}</div>`}</div>
        ${APP.mode === 'local' ? `<div class="card"><h3>This browser</h3><p class="small muted">Right now your team saves only in this browser. Once Launchpad is on your school's Google site, it saves online for the whole team.</p>
          <div class="row">${APP.demo ? `<button class="btn sm" data-act="startOwnTeam">${icon('plus')}Start our own team</button><button class="btn sm ghost" data-act="resetDemo">Reset the example</button>` : `<button class="btn sm ghost" data-act="startOwnTeam">${icon('plus')}Start another team</button>`}</div></div>` : ''}
      </div>
    </div>`;
}
ACT.addMember = () => { S.members.push({ id: uid(), name: '', email: '', role: 'Teacher', periods: '' }); save(); render(); setTimeout(() => { const ins = $$('[data-bind$=".name"]'); ins[ins.length - 1]?.focus(); }, 30); };
ACT.delMember = async b => {
  if (!await ask(`<h2>Remove this teacher?</h2><p class="muted">Scores they entered stay with the plan.</p><div class="row end"><button type="button" class="btn ghost" data-cancel>Keep</button><button class="btn danger">Remove</button></div>`)) return;
  S.members = S.members.filter(m => m.id !== b.dataset.id); save(); render();
};
ACT.addNorm = () => { S.norms.push({ id: uid(), text: '' }); save(); render(); };
ACT.delNorm = b => { S.norms = S.norms.filter(n => n.id !== b.dataset.id); save(); render(); };
ACT.toggleCat = b => { const k = b.dataset.k, c = S.team.catalogs || []; S.team.catalogs = c.includes(k) ? c.filter(x => x !== k) : [...c, k]; save(); render(); };
ACT.resetDemo = async () => {
  if (!await ask(`<h2>Reset the example team?</h2><div class="row end"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn">Reset</button></div>`)) return;
  S = sampleState(); ME = 'm1'; store.set('lp-me:demo', 'm1'); save(); go('home');
};

/* ================================================================ PLC WORDS */
function viewWords() {
  return `<div class="page-head"><div class="lead"><span class="eyebrow">PLC words</span><h1>Plain words, real terms</h1>
    <p>Launchpad uses everyday words on every screen, with the PLC term right beside them. Here they all are in one place.</p></div></div>
    ${Object.entries({ ...FAMILIES, team: { n: '', word: 'Team', q: 'How do we work together?' } }).map(([f, info]) => `<div class="stack" style="margin-bottom:28px">
      <div class="row f-${f}"><span class="orb">${icon(f)}</span><h2 style="font-size:1.4rem">${info.n ? info.n + ' · ' : ''}${info.word}</h2><span class="muted">${esc(info.q)}</span></div>
      <div class="words">${WORDS.filter(w => w[0] === f).map(w => `<div class="word f-${f}"><h3>${esc(w[1])}</h3><span class="term" style="cursor:default"><span class="tag">PLC term</span>${esc(w[2])}</span>
        <p>${esc(w[3])}</p>${w[4] ? `<p class="example"><i>Example:</i> ${esc(w[4])}</p>` : ''}
        <div><button class="btn sm soft" data-act="say" data-text="${esc(w[2] + '. ' + w[3])}">${icon('listen')}Hear it</button></div></div>`).join('')}</div></div>`).join('')}`;
}

/* ================================================================ START */
window.addEventListener('hashchange', () => { voice.stop(); render(); });
boot().then(ok => { if (ok) render(); });

})();</script>

</body>
</html>
