(async function launch(){
'use strict';
await window.__PLC.ready;
const query=new URLSearchParams(window.__PLC.search);
const lastOnlineKey='plc-launchpad:last-online-workspace';
const workspaceIdPattern=/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i;
function rememberOnlineWorkspace(id){
  try{localStorage.setItem(lastOnlineKey,id)}catch{}
}
function previousOnlineWorkspaces(){
  try{
    const remembered=localStorage.getItem(lastOnlineKey);
    if(workspaceIdPattern.test(remembered||''))return [remembered];
    const ids=new Set();
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i)||'';
      if(!key.startsWith('plc-shared:'))continue;
      const id=key.split(':')[1];
      if(workspaceIdPattern.test(id))ids.add(id);
    }
    return [...ids];
  }catch{return []}
}
function onlineUrl(id){
  const url=new URL(location.href);
  url.searchParams.set('shared',id);
  return url.href;
}
if(!location.search&&!location.hash){
  const ids=previousOnlineWorkspaces();
  if(ids.length===1){location.replace(onlineUrl(ids[0]));return}
  if(ids.length>1){
    const chooser=document.createElement('dialog');
    chooser.innerHTML='<h2>Reopen a saved workspace</h2><p>This browser has used more than one online workspace.</p>';
    for(const id of ids){
      const anchor=document.createElement('a');
      anchor.href=onlineUrl(id);
      let title='Online workspace';
      try{
        for(const key of Object.keys(localStorage)){
          if(!key.startsWith('plc-shared:'+id+':')||!key.endsWith(':v1'))continue;
          const cached=JSON.parse(localStorage.getItem(key));
          title=[cached.course,cached.team].filter(Boolean).join(' · ')||title;
          break;
        }
      }catch{}
      anchor.textContent=title+' ('+id.slice(-6)+')';
      const row=document.createElement('p');row.append(anchor);chooser.append(row);
    }
    const local=document.createElement('a');local.href='?local=1';local.textContent='Open local workspace';
    chooser.append(local);document.body.append(chooser);
    chooser.addEventListener('cancel',event=>event.preventDefault());chooser.showModal();document.getElementById('workspaceLoadStatus').hidden=true;return;
  }
}
const teamWorkspaceId=query.get('shared')||query.get('manage');
let sharedId=teamWorkspaceId;
const cloudDemo=!!query.get('shared')&&/^[a-f0-9-]{36}$/i.test(sharedId||'');
let cloudEtag='',cloudReady=false,cloudDirty=false,cloudSaving=false,cloudConflict=false,cloudTimer;
let cloudPayload=null,cloudBase=null,pendingBackupOK=true,directory=null;
const directoryEndpoint='/api/directory/'+teamWorkspaceId;
function teamCode(t){return /^[a-f0-9-]{36}$/.test(t.id)?'team-'+t.id:t.id}
function teamByCode(code){return directory?.teams.find(t=>teamCode(t)===code)}
function teamHref(code){
  const url=new URL(window.__PLC.execUrl);
  url.searchParams.set('shared',teamWorkspaceId);url.searchParams.set('course',code);url.hash='/'+code;return url;
}
if(query.get('manage')&&workspaceIdPattern.test(teamWorkspaceId||'')){
  const response=await fetch(directoryEndpoint,{cache:'no-store'});
  if(response.ok)directory=await response.json();
}
if(cloudDemo){
  try{
    const catalogResponse=await fetch(directoryEndpoint,{cache:'no-store'});
    if(!catalogResponse.ok)throw Error();
    directory=await catalogResponse.json();
    const requestedCourse=query.get('course');
    if(requestedCourse){
      const lookup=await fetch('/api/demo/'+teamWorkspaceId+'?course='+encodeURIComponent(requestedCourse),{method:'POST'});
      if(!lookup.ok)throw Error();
      sharedId=(await lookup.json()).id;
    }
    const response=await fetch('/api/demo/'+sharedId,{cache:'no-store'});
    if(response.status===410){
      try{for(const k of Object.keys(localStorage))if(k.startsWith('plc-shared:'+sharedId+':'))localStorage.removeItem(k)}catch{}
      throw Error('removed');
    }
    if(!response.ok)throw Error();
    const saved=await response.json();cloudPayload=saved.payload;cloudEtag=saved.etag;
  }catch(error){
    document.documentElement.classList.remove('workspace-loading');
    if(directory){
      document.body.innerHTML='<main><h1>Workspace unavailable</h1><p>This team could not be opened. Select another team or retry.</p><button onclick="plcReload()">Retry</button></main>';
      const main=document.querySelector('main');
      for(const team of directory.teams.filter(t=>!t.removed&&directory.subjects.some(s=>s.id===t.subjectId&&!s.removed))){const a=document.createElement('a');a.href=teamHref(teamCode(team));a.textContent=team.name;const row=document.createElement('p');row.append(a);main.append(row)}
      if(directory.admin||!directory.signed){
        const link=document.createElement('a');link.href=window.__PLC.execUrl+'?manage='+teamWorkspaceId;link.textContent='Manage directory';main.append(link);
      }
      return;
    }
    document.body.innerHTML='<main><h1>Workspace could not be loaded</h1><p>Check your connection and reload this same link. Your saved workspace has not been replaced.</p><button onclick="plcReload()">Retry</button></main>';return}
}
const demoId=query.get('demo');
const inDemo=/^[a-f0-9-]{36}$/i.test(demoId||'');
const demoPrefix=cloudDemo?'plc-shared:'+sharedId+':':inDemo?'plc-demo:'+demoId+':':'';
let incoming=null,loadError='';
if(inDemo&&location.hash.startsWith('#saved=')){
  try{
    const encoded=location.hash.slice(7).replace(/-/g,'+').replace(/_/g,'/');
    if(encoded.length>200000)throw Error();
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const reader=stream.getReader(),chunks=[];let size=0;
    while(true){const result=await reader.read();if(result.done)break;size+=result.value.length;if(size>8000000){await reader.cancel();throw Error()}chunks.push(result.value)}
    incoming=JSON.parse(await new Blob(chunks).text());
  }catch{loadError='This workspace link could not be opened. Ask for a fresh link or a workspace backup.'}

let followupContext=null;
function followupCandidates(original,skill,cutoff){
  const skills=learningSkills(original.snapshot.assessment.items);
  const selected=skills.find(s=>s.name===skill);
  if(!selected)return [];
  return analyzeResults(original).rows.filter(row=>{
    if(row.invalid)return false;
    const values=selected.indexes.map(i=>row.values[i]);
    if(values.some(v=>v===null))return true;
    const earned=values.reduce((n,v)=>n+v,0);
    const possible=selected.indexes.reduce((n,i)=>n+Number(original.snapshot.assessment.items[i].maxPoints),0);
    return possible>0&&earned/possible+1e-8<cutoff;
  }).map(x=>x.row);
}
function sourceSkillCutoff(original,skill){
  const a=original.snapshot.assessment;
  return assessmentTotal(a)>0?Number(a.threshold)/assessmentTotal(a):.8;
}
function updateFollowupGroup(){
  if(!followupContext)return;
  const {original}=followupContext,skill=$('followupSkill').value;
  const cutoff=sourceSkillCutoff(original,skill);
  const students=followupCandidates(original,skill,cutoff);
  $('followupGroup').textContent=students.length+' students scored below '+pct(cutoff*100)+' on this skill or are awaiting evidence. Their names and periods will carry over when you open the scorebook.';
}
function startFollowup(original){

  followupContext={original,cycleId:activeCycleId,standardId:locationParts[1]};
  $('followupSkill').innerHTML=skills.map(s=>'<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>').join('');
  const a=original.snapshot.assessment;
  {
    const rows=analyzeResults(original).rows;
    const scored=skills.map(s=>({name:s.name,rate:skillEvidence(rows,a.items,s.indexes).rate})).filter(s=>s.rate!==null).sort((a,b)=>a.rate-b.rate);

function standardCard(s,plan=null,picker=false){
  const targets=plan?[plan]:state.cycles.filter(c=>touches(c,s.id));
  let practiceCount=0;
  const stages=progressParts.map(()=>({values:[]}));
  const record=(index,ready,started)=>stages[index].values.push(ready?2:started?1:0);
  for(const c of targets){
    record(0,!!c.learning.trim(),true);
    record(1,!issues(c).length,[c.goalOverride,c.group,c.target,c.deadline].some(v=>v?.trim()));
    const checks=linkedAssessments(c,s.id);
    const allResults=c.assessments.flatMap(a=>a.results||[]);
    const followups=new Set(allResults.map(r=>r.teamPlan?.followup).filter(Boolean));
    for(const a of checks.length?checks:[null]){
      record(2,a&&!assessmentIssues(a,c).length,!!a);
      const results=(a?.results||[]).filter(r=>r.snapshot.assessment.items.some(i=>i.standardId===s.id));
      for(const r of results.length?results:[null]){
        const rows=r?analyzeResults(r).rows:[];
        if(r?.voluntaryStrategies?.length){
          const skillNames=new Set(r.snapshot.assessment.items.filter(i=>i.standardId===s.id).map(i=>i.learningTarget||i.prompt));
          practiceCount+=sharedPosts(r,rows).filter(post=>skillNames.has(post.skill)).length;
        }
        record(3,rows.length&&rows.every(x=>x.assessed),rows.some(x=>x.values.some(Number.isFinite)));
        // A result can be linked as evidence and still own a Next Steps plan.
        // Only skip linked review-only results; never discard entered planning work.
        const hasPlanningWork=['support','extension','missing','owner','start','check'].some(k=>r?.teamPlan?.[k]?.trim());
        if(r&&followups.has(r.id)&&!hasPlanningWork)continue;
        const plan=r?.teamPlan||{};
        const actions=['support','extension','missing','owner','start','check','review'];
        record(4,actions.every(k=>plan[k]?.trim()),actions.some(k=>plan[k]?.trim()));
        const later=allResults.find(other=>other.id===plan.followup);
        record(5,(plan.reflection?.trim()||later?.teamPlan?.reflection?.trim())&&later&&analyzeResults(later).rows.some(x=>x.assessed),!!(plan.followup||plan.reflection?.trim()));
      }
    }
  }
  const levels=stages.map(({values})=>values.length&&values.every(v=>v===2)?2:values.some(v=>v>0)?1:0);
  const count=levels.filter(v=>v===2).length;
  const chips=levels.map((level,i)=>progressIcon(i,level)).join('');
  if(plan)return '<div class="stage-checklist home-plan-progress">'+chips+practiceBadge(practiceCount)+'</div><span class="plan-completion '+(count===progressParts.length?'complete':'in-progress')+'">'+(count===progressParts.length?'Complete':'In progress')+'</span>';
  if(picker)return '<span class="picker-card-progress"><span class="picker-card-plan-count">'+targets.length+' cycle'+(targets.length===1?'':'s')+'</span><span class="stage-checklist">'+chips+(practiceCount?practiceBadge(practiceCount):'')+'</span><span class="picker-card-status">'+(targets.length?(count===progressParts.length?'Complete':'In progress'):'No plan yet')+'</span></span>';
  const targetLinks=targets.map(c=>{const hasScores=c.assessments.some(a=>a.results.length);return '<a class="workspace-target-row" href="'+urlFor('target',s.id,c.id)+'"><strong>'+esc(c.title||'Untitled cycle')+'</strong><span>'+ (hasScores?'In progress':issues(c).length?'Planning':'Goal ready')+'</span>'+productIcon('arrow')+'</a>'}).join('');
  return '<details class="workspace-standard-card"><summary class="workspace-standard-strip">'+productIcon('book')+'<span>'+esc(s.code)+'</span><strong>'+esc(workspaceStandardTitle(s))+'</strong>'+productIcon('arrow','standard-chevron')+'</summary><div class="workspace-standard-body"><p>'+esc(s.text)+'</p><small>'+targets.length+' cycle'+(targets.length===1?'':'s')+'</small><div class="workspace-target-list">'+(targetLinks||'<button type="button" class="workspace-add-target" data-command="workspace-new-target" data-standard="'+s.id+'">+ Add cycle</button>')+'</div></div><div class="workspace-progress"><span>PLC progress</span><div class="stage-checklist">'+chips+(practiceCount?practiceBadge(practiceCount):'')+'</div>'+link('Open standard',['standard',s.id])+'</div></details>';

}

function copyValue(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v))}
function sameValue(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function mergeWorkspace(base,mine,online){
 const conflicts=[];
 function visit(b,m,o,path=[]){
  if(sameValue(m,o))return copyValue(m);
  if(sameValue(m,b))return copyValue(o);
  if(sameValue(o,b))return copyValue(m);
  if(path[0]==='resume')return copyValue(o);
  const object=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const scored=object(b)&&b.snapshot&&((!sameValue(b.snapshot,m?.snapshot))||(!sameValue(b.snapshot,o?.snapshot)));
  const keyed=v=>Array.isArray(v)&&v.every(x=>object(x)&&typeof x.id==='string')&&new Set(v.map(x=>x.id)).size===v.length;
  if(keyed(b)&&keyed(m)&&keyed(o)){
   const bm=new Map(b.map(x=>[x.id,x])),mm=new Map(m.map(x=>[x.id,x])),om=new Map(o.map(x=>[x.id,x]));
   return [...new Set([...o.map(x=>x.id),...m.map(x=>x.id)])].map(id=>visit(bm.get(id),mm.get(id),om.get(id),path.concat(id))).filter(x=>x!==undefined);
  }
  if(object(b)&&object(m)&&object(o)&&!scored&&path.at(-1)!=='snapshot'){
   const out={};for(const k of new Set([...Object.keys(b),...Object.keys(m),...Object.keys(o)])){const v=visit(b[k],m[k],o[k],path.concat(k));if(v!==undefined)Object.defineProperty(out,k,{value:v,writable:true,enumerable:true,configurable:true})}return out;
  }
  const key=path.at(-1),canCombine=typeof m==='string'&&typeof o==='string'&&['discussionNotes','nextSteps','reflection','support','extension','missing','strategies','responsibilities','context','text'].includes(key)&&m.trim()&&o.trim();
  const id=conflicts.length;conflicts.push({path,mine:copyValue(m),online:copyValue(o),canCombine:!!canCombine});return {__plcConflict:id};
 }
 return {merged:visit(base,mine,online),conflicts};
}
function resolvedWorkspace(review,choices){
 function walk(v){if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length===1&&Number.isInteger(v.__plcConflict)){const i=v.__plcConflict,c=review.conflicts[i],choice=choices[i];if(!choice)throw Error('Choose a version for every highlighted conflict.');return copyValue(choice==='mine'?c.mine:choice==='online'?c.online:c.mine+'\n\n'+c.online)}if(Array.isArray(v))return v.map(walk).filter(x=>x!==undefined);if(v&&typeof v==='object'){const o={};for(const [k,x] of Object.entries(v)){const next=walk(x);if(next!==undefined)Object.defineProperty(o,k,{value:next,writable:true,enumerable:true,configurable:true})}return o}return v}return walk(review.merged);
}

function folderColorStyle(folder){
 return validFolderColor(folder?.color)?' style="--folder-fill:'+folder.color+';--folder-edge:color-mix(in srgb,'+folder.color+' 45%,#243448)"':'';
}
function validPlanOrganization(s){
 const folders=s.planFolders;
 return (s.defaultPlanView===undefined||['folder','standard','all','unit'].includes(s.defaultPlanView))&&
   (folders===undefined||Array.isArray(folders)&&folders.every(f=>f&&safeId(f.id)&&typeof f.name==='string'&&f.name.trim()&&f.name.length<=160&&(f.color===undefined||validFolderColor(f.color)))&&new Set(folders.map(f=>f.id)).size===folders.length);
}
function homeFolder(plan){
 return state.planFolders.find(f=>f.id===plan.folderId);
}
function planStandardIds(plan){
 const ids=new Set(plan.standardIds);
 for(const a of plan.assessments){
   for(const item of a.items)ids.add(item.standardId);
   for(const r of a.results)for(const item of r.snapshot.assessment.items)ids.add(item.standardId);
 }
 return [...ids].filter(id=>byId.has(id));
}
function folderAction(action,label,id=''){
 const icons={create:'folderPlus',move:'folderMove',bulk:'folderMove',rename:'edit',remove:'trash',default:'check'};
 const name=label.replace(/^\+ /,'').replace(/…$/,'');
 return '<button type="button" class="secondary plan-folder-action workspace-icon-action" data-folder-action="'+action+'" data-folder-id="'+esc(id)+'" title="'+esc(name)+'" aria-label="'+esc(name)+'">'+productIcon(icons[action])+'</button>';
}
let planToolsOpen=false;
let planKeyOpen=false;
function matchingPlanCards(cards){
 const q=planSearch.trim().toLowerCase();
 if(!q)return cards;
 return cards.filter(({plan})=>{
   const values=[plan.title,plan.learning,plan.context,homeFolder(plan)?.name,...planStandardIds(plan).map(id=>byId.get(id).code)];
   return values.join(' ').toLowerCase().includes(q);
 });
}
function pinnedPlanCards(cards){
 const pinned=cards.filter(card=>card.plan.pinned);
 if(pinned.length)return '<div class="home-plan-list">'+pinned.map(card=>card.html).join('')+'</div>';
 return '<p class="pin-empty">'+(planSearch.trim()?'No pinned plans match your search.':'Pin a plan to keep it here while your team is working on it.')+'</p>';
}
function groupedPlanCards(cards){
 const groups=new Map(),view=planGrouping||state.defaultPlanView||'folder',q=planSearch.trim().toLowerCase();
 function group(key,name,folderId){
   if(!groups.has(key))groups.set(key,{key,name,folderId,items:[]});
   return groups.get(key);
 }
 if(view==='folder'){
   for(const folder of state.planFolders)group('folder:'+folder.id,folder.name,folder.id);
   group('unfiled','Uncategorized','');
 }
 for(const card of cards){
   const plan=card.plan,folder=homeFolder(plan),ids=planStandardIds(plan);
   if(view==='folder')group(folder?'folder:'+folder.id:'unfiled',folder?.name||'Uncategorized',folder?.id||'').items.push(card);
   else if(view==='standard'){
     for(const id of ids){const s=byId.get(id);group('standard:'+id,s.code+' · '+workspaceStandardTitle(s)).items.push(card)}
     if(!ids.length)group('no-standard','No linked standard').items.push(card);
   }else{
     const name=view==='unit'?(plan.context.trim()||'Unassigned'):'All plans';
     group(view+':'+name,name).items.push(card);
   }
 }
 const list=[...groups.values()].filter(g=>!q||g.items.length).sort((a,b)=>{
   if(a.key==='unfiled')return 1;
   if(b.key==='unfiled')return -1;
   return a.name.localeCompare(b.name,undefined,{numeric:true});
 });
 return list.map(g=>{
   const open=q|| (planGroupOpen.get(g.key)??(view==='all'||view==='unit'||list.length===1||g.key==='unfiled'&&!state.planFolders.length));
   const actions=[];
   if(view==='folder'){
     if(g.items.length)actions.push(folderAction('bulk','Move Plans…',g.folderId));
     if(g.folderId)actions.push(folderAction('rename','Edit Folder',g.folderId),folderAction('remove','Remove Folder',g.folderId));
   }
   const contents=g.items.sort((a,b)=>Number(!!b.plan.pinned)-Number(!!a.plan.pinned)).map(card=>card.html).join('');
   return '<details class="home-plan-group" data-plan-unit="'+esc(g.key)+'" '+(open?'open':'')+'><summary'+folderColorStyle(view==='folder'?state.planFolders.find(f=>f.id===g.folderId):null)+'>'+productIcon('arrow','plan-group-chevron')+(view==='folder'?productIcon('folder','folder-symbol'):'')+'<strong>'+esc(g.name)+'</strong> <span>'+g.items.length+'</span></summary>'+(actions.length?'<div class="folder-group-actions">'+actions.join('')+'</div>':'')+(contents?'<div class="home-plan-list">'+contents+'</div>':'<p class="field-help">No plans in this folder.</p>')+'</details>';
 }).join('')||'<p>No plans match your search.</p>';
}

 if(!trigger)return;

 const view=planGrouping||state.defaultPlanView||'folder';
 const options=Object.entries(planViews).map(([id,label])=>'<option value="'+id+'" '+(id===view?'selected':'')+'>'+label+'</option>').join('');
 return '<div id="planToolsPanel" '+(planToolsOpen?'':'hidden')+'><div class="home-plan-controls"><label class="home-plan-search">Find a plan<input id="planSearch" type="search" placeholder="Search plans, folders, or standard codes" value="'+esc(planSearch)+'"></label><label class="home-group-choice">View<select id="planGrouping">'+options+'</select></label></div><div class="plan-view-default">'+(view===(state.defaultPlanView||'folder')?'<small>Team default view</small>':folderAction('default','Set as Team Default'))+'</div></div>';

$('workspaceBody').addEventListener('change',event=>{
 if(event.target.id!=='planGrouping')return;
 planGrouping=event.target.value;renderRoute();
});
$('workspaceBody').addEventListener('input',event=>{
 if(event.target.id!=='planSearch')return;

 $('homePinnedPlans').innerHTML=pinnedPlanCards(cards);

document.addEventListener('toggle',event=>{
 const group=event.target;
 if(group.isConnected&&group.matches?.('[data-plan-unit]')&&!planSearch.trim())planGroupOpen.set(group.dataset.planUnit,group.open);
},true);
function planFolderDialog(action,id,trigger){
 const workspace=state,folder=state.planFolders.find(f=>f.id===id),naming=action==='create'||action==='rename';
 const single=action==='move'?state.cycles.find(c=>c.id===id):null;
 const sourceId=single?homeFolder(single)?.id||'':id;
 const available=state.cycles.filter(c=>(homeFolder(c)?.id||'')===sourceId);
 const title=naming?(action==='create'?'New Folder':'Edit Folder'):(single?'Move Plan':'Move Plans');
 const dialog=document.createElement('dialog');
 dialog.className='plan-folder-dialog';dialog.setAttribute('aria-labelledby','planFolderTitle');
 const destinations=[{id:'',name:'Uncategorized'},...state.planFolders].filter(f=>f.id!==sourceId);
 const destinationOptions=destinations.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>').join('');
 const folderFields='<div class="folder-appearance" '+(naming?'':'data-new-folder-field hidden')+'><label>Folder name<input name="folderName" '+(naming?'required':'')+' maxlength="160" value="'+esc(naming?folder?.name||'':'')+'"></label><div>Folder color<button type="button" data-color-picker aria-label="Choose folder color" style="--swatch:'+(action==='rename'&&validFolderColor(folder?.color)?folder.color:'#edc65c')+'"></button><input type="hidden" name="folderColor" value="'+(action==='rename'&&validFolderColor(folder?.color)?folder.color:'#edc65c')+'"></div></div>';
 let fields;
 if(naming)fields=folderFields;
 else{
   const selection=single?'<p>'+esc(single.title||'Untitled cycle')+'</p>':'<fieldset><legend>Plans in '+esc(folder?.name||'Uncategorized')+'</legend><label><input type="checkbox" data-select-folder-plans>Select all</label><div class="folder-plan-choices">'+available.map(c=>'<label><input type="checkbox" name="plan" value="'+esc(c.id)+'">'+esc(c.title||'Untitled cycle')+'</label>').join('')+'</div></fieldset>';
   fields=selection+'<label>Move to<select name="destination"><option value="" disabled selected>Choose a destination</option>'+destinationOptions+'<option value=":new">New folder…</option></select></label>'+folderFields;
 }
 dialog.innerHTML='<form><h2 id="planFolderTitle">'+title+'</h2>'+fields+'<p class="folder-error" role="status"></p><div class="folder-dialog-actions"><button class="secondary" type="button" data-cancel>Cancel</button><button type="submit" class="primary">'+(naming?(action==='create'?'Create Folder':'Save Changes'):'Move')+'</button></div></form>';
 const form=dialog.querySelector('form'),error=dialog.querySelector('.folder-error');
 const colorButton=form.querySelector('[data-color-picker]');
 colorButton.onclick=()=>{
   const picker=document.createElement('dialog');
   picker.className='plan-folder-dialog';
   picker.setAttribute('aria-label','Folder color');
   const colors=['#edc65c','#e19a69','#cd7381','#ad86c3','#849cda','#6caeb7','#81ad8d','#8695a6'];
   picker.innerHTML='<form><h2>Folder color</h2><div class="folder-palette">'+colors.map(c=>'<button type="button" data-swatch="'+c+'" style="--swatch:'+c+'" aria-label="Choose '+c+'"></button>').join('')+'</div><label>Custom color<input type="color" name="custom"></label><div class="folder-dialog-actions"><button type="button" class="secondary" data-dismiss>Cancel</button><button class="primary" type="submit">Set color</button></div></form>';
   const choices=picker.querySelector('form'),custom=choices.elements.custom;
   custom.value=form.elements.folderColor.value;
   choices.onclick=e=>{if(e.target.dataset.swatch)custom.value=e.target.dataset.swatch};
   choices.onsubmit=e=>{e.preventDefault();form.elements.folderColor.value=custom.value;colorButton.style.setProperty('--swatch',custom.value);picker.close()};
   picker.querySelector('[data-dismiss]').onclick=()=>picker.close();
   picker.onclose=()=>{picker.remove();colorButton.focus()};
   dialog.append(picker);picker.showModal();
 };
 dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();
 form.onchange=e=>{
   error.textContent='';
   if(e.target.matches('[data-select-folder-plans]'))for(const box of form.querySelectorAll('[name=plan]'))box.checked=e.target.checked;
   if(e.target.name==='plan'){
     const boxes=[...form.querySelectorAll('[name=plan]')],all=form.querySelector('[data-select-folder-plans]');
     all.checked=boxes.every(b=>b.checked);all.indeterminate=!all.checked&&boxes.some(b=>b.checked);
   }
   if(e.target.name==='destination'){
     const show=e.target.value===':new';form.querySelector('[data-new-folder-field]').hidden=!show;
     if(show)form.elements.folderName.focus();
   }
 };
 form.onsubmit=e=>{
   e.preventDefault();
   if(state!==workspace){dialog.close();return}
   const destination=form.elements.destination;
   const create=naming||destination?.value===':new';
   const name=form.elements.folderName.value.trim();
   if(create&&(!name||name.toLowerCase()==='uncategorized'||state.planFolders.some(f=>f.name.toLowerCase()===name.toLowerCase()&&(action!=='rename'||f.id!==id)))){
     error.textContent='Choose a unique folder name. Uncategorized is reserved for plans without a folder.';form.elements.folderName.focus();return;
   }
   const moving=naming?[]:single?[single.id]:[...form.querySelectorAll('[name=plan]:checked')].map(box=>box.value);
   if(!naming&&(!moving.length||destination.selectedOptions[0].disabled)){error.textContent='Select at least one plan and a destination.';return}
   const color=form.elements.folderColor.value;
   let target=destination?.value;
   if(action==='rename'){
     folder.name=name;folder.color=color;
   }else if(create){
     target=crypto.randomUUID();state.planFolders.push({id:target,name,color});
   }
   for(const c of state.cycles)if(moving.includes(c.id)){
     if(target)c.folderId=target;else delete c.folderId;
   }
   if(action==='create'){planGrouping='folder';planSearch=''}
   if(target)planGroupOpen.set('folder:'+target,true);
   else if(!naming)planGroupOpen.set('unfiled',true);
   save();dialog.close();renderRoute();
   toast(naming?(action==='rename'?'Folder updated.':'Folder created.'):moving.length+' plan'+(moving.length===1?'':'s')+' moved.');
 };
 const dismiss=()=>dialog.close();
 window.addEventListener('hashchange',dismiss);
 dialog.addEventListener('close',()=>{window.removeEventListener('hashchange',dismiss);dialog.remove();if(trigger.isConnected)trigger.focus()},{once:true});
 document.body.append(dialog);dialog.showModal();
}
$('workspaceBody').addEventListener('click',async event=>{
 const button=event.target.closest('[data-folder-action]');if(!button)return;
 const action=button.dataset.folderAction,id=button.dataset.folderId;
 if(action==='default'){state.defaultPlanView=planGrouping||state.defaultPlanView||'folder';save();renderRoute();return}
 if(action==='remove'){
   const folder=state.planFolders.find(f=>f.id===id);if(!folder)return;
   if(!await confirmAction('Remove Folder?','Remove Folder','danger','Remove “'+folder.name+'”? Its plans will move to Uncategorized with all their saved work.',button))return;
   prepareUndo('Plan folder removed.');state.planFolders=state.planFolders.filter(f=>f.id!==id);
   for(const plan of state.cycles)if(plan.folderId===id)delete plan.folderId;
   save();renderRoute();return;
 }
 planFolderDialog(action,id,button);
});

function validMeetings(value){
 return value===undefined||Array.isArray(value)&&value.length<=300&&new Set(value.map(m=>m?.id)).size===value.length&&value.every(m=>m&&typeof m.id==='string'&&/^[A-Za-z0-9_-]{1,80}$/.test(m.id)&&['title','date','time','location','notes'].every(k=>typeof m[k]==='string'&&m[k].length<=6000)&&Array.isArray(m.agenda)&&m.agenda.length<=100&&new Set(m.agenda.map(a=>a?.id)).size===m.agenda.length&&m.agenda.every(a=>a&&typeof a.id==='string'&&['title','planId','notes','decision','owner','due'].every(k=>typeof a[k]==='string'&&a[k].length<=6000)));
}

function meetingAttendance(m){
 const selected=Array.isArray(m.attendance)?m.attendance:state.members.map(x=>({id:x.id,name:x.name,email:x.email}));
 const roster=[...state.members,...selected.filter(x=>!state.members.some(r=>r.id===x.id))];
 return '<fieldset class="meeting-attendance"><legend>Attendance</legend><div>'+roster.map(x=>'<label><input type="checkbox" data-meeting-attendee="'+esc(x.id)+'" '+(selected.some(a=>a.id===x.id)?'checked':'')+'><span>'+esc(x.name||x.email||'Unnamed member')+'</span></label>').join('')+'</div>'+(!roster.length?'<p class="field-help">Add team members in Settings to record attendance.</p>':'')+'</fieldset>';
}
function nextAgendaMeeting(meetings,source){
 const index=meetings.indexOf(source);
 const dated=meetings.filter((m,i)=>{
   if(m===source||!m.date)return false;
   if(!source.date)return i>index;
   const order=(m.date+m.time).localeCompare(source.date+source.time);
   return order>0||order===0&&i>index;
 });
 dated.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return dated[0]||meetings.slice(index+1).find(m=>!m.date);
}
function carryAgendaItems(meetings){
 const assignments=meetings.flatMap(source=>source.agenda.filter(a=>a.carryId).map(item=>({sou
